<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <title>Aplikasi 1 - VR Galeri Objek 3D</title>
  <meta name="description" content="Galeri VR dengan objek 3D primitif dan model glTF" />
  <!-- A-Frame Library -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    .info-panel {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 13px;
      max-width: 280px;
      z-index: 999;
      border-left: 3px solid #f5a623;
    }

    .info-panel h3 {
      margin: 0 0 8px 0;
      color: #f5a623;
      font-size: 14px;
    }

    .info-panel p {
      margin: 4px 0;
      line-height: 1.5;
    }

    .back-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      padding: 8px 14px;
      background: rgba(233, 69, 96, 0.9);
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      z-index: 999;
    }
    .footer-credit {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 12px;
      text-align: center;
      z-index: 999;
      border-top: 2px solid #f5a623;
      line-height: 1.5;
    }
    .footer-credit b { color: #f5a623; }
  </style>

  <!-- Custom Component: interaksi click pada objek -->
  <script>
    AFRAME.registerComponent('clickable', {
      init: function () {
        const el = this.el;
        const originalColor = el.getAttribute('material').color;

        el.addEventListener('mouseenter', function () {
          el.setAttribute('material', 'color', '#f5a623');
          el.setAttribute('scale', '1.2 1.2 1.2');
        });

        el.addEventListener('mouseleave', function () {
          el.setAttribute('material', 'color', originalColor);
          el.setAttribute('scale', '1 1 1');
        });

        el.addEventListener('click', function () {
          // Memberi efek putar saat di-klik
          el.setAttribute('animation__click', {
            property: 'rotation',
            to: '0 360 0',
            dur: 1500,
            easing: 'easeInOutQuad'
          });
        });
      }
    });

    // Fallback: jika model glTF gagal dimuat (404/network),
    // tampilkan objek pengganti agar scene tetap informatif.
    AFRAME.registerComponent('model-fallback', {
      schema: {
        label: { type: 'string', default: 'Model tidak tersedia' }
      },
      init: function () {
        const el = this.el;
        const data = this.data;
        const showFallback = (reason) => {
          console.warn('[model-fallback] gagal memuat model:', reason);
          // Hindari duplikasi jika event terpicu lebih dari sekali
          if (el.dataset.fallbackShown === '1') return;
          el.dataset.fallbackShown = '1';
          el.removeAttribute('gltf-model');

          // Objek pengganti: bebek karet sederhana (sphere kuning)
          const placeholder = document.createElement('a-sphere');
          placeholder.setAttribute('radius', 60);
          placeholder.setAttribute('material', 'color: #f5d142; metalness: 0.2; roughness: 0.6');
          el.appendChild(placeholder);

          // Label peringatan
          const warn = document.createElement('a-text');
          warn.setAttribute('value', data.label);
          warn.setAttribute('align', 'center');
          warn.setAttribute('color', '#ff6b6b');
          warn.setAttribute('position', '0 120 0');
          warn.setAttribute('scale', '80 80 80');
          el.appendChild(warn);
        };

        el.addEventListener('model-error', (e) => showFallback(e.detail));

        // Beberapa kasus 404 tidak memicu 'model-error' tepat waktu;
        // pasang timeout sebagai jaring pengaman.
        setTimeout(() => {
          if (!el.getObject3D('mesh') && el.dataset.fallbackShown !== '1') {
            showFallback('timeout');
          }
        }, 8000);
      }
    });
  </script>
</head>

<body>
  <!-- Panel Informasi UI -->
  <div class="info-panel">
    <h3>🎲 VR Galeri Objek 3D</h3>
    <p><b>Navigasi:</b> WASD untuk bergerak</p>
    <p><b>Lihat:</b> Drag mouse / gerakkan kepala</p>
    <p><b>Interaksi:</b> Arahkan kursor ke objek (hover) dan klik untuk animasi</p>
  </div>
  <a href="index.html" class="back-btn">← Kembali</a>

  <!-- Footer Pembuat -->
  <footer class="footer-credit">
    Dibuat oleh <b>Ghany Abdillah Ersa</b> - NIM <b>256150200111010</b><br>
    Mahasiswa Magister Sistem Informasi <br> Fakultas Ilmu Komputer
  </footer>

  <!-- A-Frame Scene -->
  <a-scene background="color: #232336" fog="type: linear; color: #232336; near: 10; far: 40">

    <!-- Asset Management System -->
    <a-assets>
      <!-- Tekstur kayu untuk lantai -->
      <img id="floorTexture" crossorigin="anonymous" src="https://cdn.aframe.io/a-painter/images/floor.jpg" />
      <!-- Tekstur untuk pedestal -->
      <img id="marbleTexture" crossorigin="anonymous"
        src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/sechelt.jpg" />
      <!-- Model 3D (glTF) - DamagedHelmet, sampel PBR ikonik dari Khronos -->
      <a-asset-item id="helmetModel"
        src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/DamagedHelmet/glTF/DamagedHelmet.gltf"></a-asset-item>
    </a-assets>

    <!-- Pencahayaan: Ambient + Directional -->
    <a-light type="ambient" color="#445566" intensity="0.6"></a-light>
    <a-light type="directional" position="-2 4 3" color="#ffffff" intensity="0.8" castShadow="true"></a-light>
    <a-light type="point" position="0 5 0" color="#f5a623" intensity="0.5"></a-light>

    <!-- Lantai dengan tekstur -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" material="src: #floorTexture; repeat: 4 4"
      shadow="receive: true"></a-plane>

    <!-- Sky background -->
    <a-sky color="#1a1a2e"></a-sky>

    <!-- ============================== -->
    <!-- OBJEK 1: Box dengan tekstur    -->
    <!-- ============================== -->
    <a-box position="-3 1 -3" width="1.2" height="1.2" depth="1.2"
      material="src: #marbleTexture; metalness: 0.3; roughness: 0.7" shadow="cast: true" clickable
      animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
    </a-box>
    <a-text value="Box (marmer)" position="-3 2.2 -3" align="center" color="#fff" scale="0.8 0.8 0.8"></a-text>

    <!-- ============================== -->
    <!-- OBJEK 2: Sphere                -->
    <!-- ============================== -->
    <a-sphere position="-1 1.2 -3" radius="0.7" material="color: #4ecca3; metalness: 0.5; roughness: 0.4"
      shadow="cast: true" clickable
      animation="property: position; to: -1 1.8 -3; dir: alternate; loop: true; dur: 2000; easing: easeInOutQuad">
    </a-sphere>
    <a-text value="Sphere" position="-1 2.4 -3" align="center" color="#fff" scale="0.8 0.8 0.8"></a-text>

    <!-- ============================== -->
    <!-- OBJEK 3: Cylinder (pedestal)   -->
    <!-- ============================== -->
    <a-cylinder position="1 0.6 -3" radius="0.5" height="1.2" material="color: #e94560; metalness: 0.6; roughness: 0.3"
      shadow="cast: true" clickable>
    </a-cylinder>
    <a-text value="Cylinder" position="1 1.6 -3" align="center" color="#fff" scale="0.8 0.8 0.8"></a-text>

    <!-- ============================== -->
    <!-- OBJEK 4: Torus (donat)         -->
    <!-- ============================== -->
    <a-torus position="3 1.2 -3" radius="0.6" radius-tubular="0.15" rotation="90 0 0"
      material="color: #f5a623; metalness: 0.7; roughness: 0.2" shadow="cast: true" clickable
      animation="property: rotation; to: 90 360 0; loop: true; dur: 6000; easing: linear">
    </a-torus>
    <a-text value="Torus" position="3 2.2 -3" align="center" color="#fff" scale="0.8 0.8 0.8"></a-text>

    <!-- ============================== -->
    <!-- OBJEK 5: Cone (kerucut)        -->
    <!-- ============================== -->
    <a-cone position="5 1 -3" radius-bottom="0.6" radius-top="0" height="1.5"
      material="color: #9b59b6; metalness: 0.4; roughness: 0.5" shadow="cast: true" clickable>
    </a-cone>
    <a-text value="Cone" position="5 2.2 -3" align="center" color="#fff" scale="0.8 0.8 0.8"></a-text>

    <!-- ============================== -->
    <!-- MODEL 3D (glTF): Pajangan utama -->
    <!-- ============================== -->
    <a-entity position="0 0 -6">
      <!-- Pedestal -->
      <a-cylinder position="0 0.5 0" radius="0.8" height="1" material="color: #2c3e50; metalness: 0.8; roughness: 0.2"
        shadow="cast: true"></a-cylinder>
      <!-- Model helm sci-fi PBR -->
      <a-entity gltf-model="#helmetModel" model-fallback="label: Model helm gagal dimuat"
        position="0 1.7 0" rotation="0 0 0" scale="0.7 0.7 0.7"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
      </a-entity>
      <a-text value="Model glTF: Damaged Helmet" position="0 3 0" align="center" color="#f5a623" scale="1 1 1"></a-text>
    </a-entity>

    <!-- Dekorasi tambahan: lampu hias -->
    <a-sphere position="-5 3 -2" radius="0.2" material="color: #f5a623; emissive: #f5a623; emissiveIntensity: 0.8"
      animation="property: position; to: -5 3.5 -2; dir: alternate; loop: true; dur: 1500">
    </a-sphere>
    <a-sphere position="5 3 -2" radius="0.2" material="color: #4ecca3; emissive: #4ecca3; emissiveIntensity: 0.8"
      animation="property: position; to: 5 3.5 -2; dir: alternate; loop: true; dur: 1500">
    </a-sphere>

    <!-- ============================== -->
    <!-- KAMERA dengan kontrol & cursor -->
    <!-- ============================== -->
    <a-entity id="rig" position="0 1.6 2" movement-controls="speed: 0.15">
      <a-camera look-controls wasd-controls="acceleration: 30">
        <!-- Cursor reticle untuk interaksi -->
        <a-cursor color="#f5a623" raycaster="objects: [clickable]"
          animation__click="property: scale; from: 0.1 0.1 0.1; to: 1 1 1; startEvents: click; dur: 200">
        </a-cursor>
      </a-camera>
    </a-entity>

  </a-scene>
</body>

</html>
