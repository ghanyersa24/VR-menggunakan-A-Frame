<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>WebAR Jantung | Hand Control</title>
  <link rel="stylesheet" href="css/ar-common.css">
  <style>
    /* ---------- Page-specific: camera & canvas stack ---------- */
    #container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: var(--z-camera);
    }

    #three-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: var(--z-three);
      pointer-events: none;
    }

    #hand-canvas {
      /* Dimensi canvas = frame video, lalu di-scale & mirror via CSS sama
         persis dengan video element di belakangnya. Pendekatan ini (sama
         dengan naruto/index.html) memastikan koordinat landmark MediaPipe
         langsung 1:1 dengan pixel canvas — tanpa konversi manual. */
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: var(--z-hand);
      pointer-events: none;
    }

    /* ---------- Override: spinner accent ke merah untuk halaman organ ---------- */
    .spinner {
      border-top-color: var(--color-accent-red);
    }
  </style>
</head>

<body>
  <div id="container">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="three-canvas"></canvas>
    <canvas id="hand-canvas"></canvas>

    <div id="hud">
      <div class="badge">
        <div>Mode: <b id="mode-label">IDLE</b></div>
        <div>Hands: <span id="hands-count" class="muted">0</span></div>
        <div>L: <span id="gesture-l" class="muted">—</span></div>
        <div>R: <span id="gesture-r" class="muted">—</span></div>
        <div>Scale: <span id="scale-label" class="muted">1.00x</span></div>
        <div>FPS: <span id="fps" class="muted">0</span></div>
      </div>
      <a href="index.html" id="back-btn">← Kembali</a>
    </div>

    <div id="hint">👉 Tunjuk salah satu kotak untuk memilih organ</div>

    <div id="loader">
      <div class="spinner"></div>
      <p id="loader-text">Memuat model & hand tracking...<br>Izinkan akses kamera saat diminta.</p>
    </div>

    <div id="error">
      <div class="box">
        <h3>Tidak dapat memulai AR</h3>
        <p id="error-msg">Pastikan browser memiliki izin kamera dan koneksi internet aktif.</p>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
    crossorigin="anonymous"></script>

  <script type="module">
    /* =====================================================================
     * WebAR Organ — Hand Control + Pembelajaran Anatomi
     * ---------------------------------------------------------------------
     * Arsitektur modular:
     *   js/organs/index.js      → registry agregator
     *   js/organs/heart.js      → jantung (parts, builder, audio, pulse)
     *   js/organs/lungs.js      → paru-paru (parts, builder, audio, pulse)
     * Tiap module export default { key, title, icon, color, parts,
     * glbPath, audioPath, build, pulse }. Untuk menambah organ baru:
     * buat file module baru, register di index.js, selesai — tidak ada
     * perubahan di file ini.
     * ---------------------------------------------------------------------
     * App mode:
     *   • SELECTING — dua box pilihan (Jantung / Paru-paru) tampil di scene.
     *     Tunjuk salah satu dengan telunjuk dan tahan ≈0.8 detik → spawn.
     *   • ACTIVE — organ terpilih tampil di tengah layar. Thumbs up (👍)
     *     untuk despawn organ & kembali ke SELECTING.
     *
     * Skema kontrol saat ACTIVE:
     *   • Fist (kepalan) dekat organ → grab → ikuti gerakan tangan.
     *   • Dua tangan menunjuk (telunjuk) → pinch resize berdasar jarak.
     *   • Satu telunjuk dekat sebuah bagian → highlight + label 3D dengan
     *     deskripsi pembelajaran muncul mengambang di samping bagian.
     *   • Two-finger rapat (telunjuk + jari tengah dirapatkan, ring & pinky
     *     terlipat) → drag tangan = rotasi X/Y organ. Eksklusif dari
     *     pointing biasa karena cek "jari tengah extended" sebagai pembeda.
     *   • Toolbar bawah: kontrol audio Beat / Narasi + slider volume.
     *
     * Audio:
     *   • Heartbeat lub-dub disintesis live via Web Audio API (oscillator
     *     + noise burst + envelope), looping ~70 BPM. Toggle via tombol Beat.
     *   • Narasi bagian otomatis diucapkan via SpeechSynthesis (id-ID) saat
     *     selectedPart berubah, dengan delay 1 detik untuk antisipasi salah
     *     tunjuk. Toggle independen via tombol Narasi.
     *
     * Bagian yang bisa dipilih (8): ventrikel kiri/kanan, atrium kiri/kanan,
     * aorta, arteri pulmonalis, vena cava, vena pulmonalis. Definisi
     * deskripsi ada di konstanta PARTS.
     *
     * Model jantung: GLB di assets/heart.glb jika ada (mesh-nya harus
     * dinamai sesuai partId untuk picker), kalau tidak jatuh ke procedural
     * heart (sudah di-tag userData.partId).
     * ===================================================================== */

    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { ORGANS, ORGAN_ORDER } from './js/organs/index.js';

    // ---------------------------------------------------------------------
    // [1] DOM REFS
    // ---------------------------------------------------------------------
    const videoEl = document.getElementById('video');
    const canvasEl = document.getElementById('three-canvas');
    const handCanvas = document.getElementById('hand-canvas');
    const handCtx = handCanvas.getContext('2d');
    const modeLabel = document.getElementById('mode-label');
    const handsCountEl = document.getElementById('hands-count');
    const gestureLEl = document.getElementById('gesture-l');
    const gestureREl = document.getElementById('gesture-r');
    const scaleLabel = document.getElementById('scale-label');
    const fpsEl = document.getElementById('fps');
    const hintEl = document.getElementById('hint');
    const loaderEl = document.getElementById('loader');
    const loaderText = document.getElementById('loader-text');
    const errorEl = document.getElementById('error');
    const errorMsg = document.getElementById('error-msg');

    // ---------------------------------------------------------------------
    // [2] THREE.JS SETUP
    // ---------------------------------------------------------------------
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 2);

    const renderer = new THREE.WebGLRenderer({
      canvas: canvasEl,
      alpha: true,
      antialias: window.devicePixelRatio < 2,
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.setClearColor(0x000000, 0);

    // Lighting setup: ambient lebih kuat agar GLB texture tidak terlalu gelap,
    // key light dari atas-depan, rim dari kiri-belakang untuk depth,
    // fill dari bawah untuk detail bawah model.
    scene.add(new THREE.AmbientLight(0xfff0f0, 1.4));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
    keyLight.position.set(2, 3, 4);
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0xff8fa3, 0.8);
    rimLight.position.set(-2, 1, -2);
    scene.add(rimLight);
    const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
    fillLight.position.set(0, -2, 2);
    scene.add(fillLight);

    // ---------------------------------------------------------------------
    // [2b] AUDIO SYSTEM
    // - Heartbeat: synthesis lub-dub via Web Audio API (oscillator low freq
    //   + noise burst + envelope). Looping 1Hz/menyesuaikan beat visual.
    // - Narasi: SpeechSynthesis API (id-ID) untuk membaca deskripsi part.
    // Browser hanya mengizinkan AudioContext mulai dari user gesture, jadi
    // semua audio di-resume() di tombol Suara atau klik pertama di canvas.
    // ---------------------------------------------------------------------
    const audio = {
      ctx: null,
      masterGain: null,
      beatGain: null,
      narrGain: null,
      // <audio> element per organ + MediaElementAudioSourceNode-nya.
      // Routing: <audio> → MediaElementSource → beatGain → masterGain → out.
      // Pakai file MP3 asli (assets/heart.mp3, assets/lungs.mp3) yang
      // di-loop kontinyu — lebih realistis dari synth procedural.
      organElements: {},  // { heart: HTMLAudioElement, lungs: HTMLAudioElement }
      organSources: {},   // { heart: MediaElementAudioSourceNode, ... }
      activeOrganLoop: null,
      enabled: true,
      beatEnabled: true,
      narrEnabled: true,
      volume: 0.7,
      voice: null,
      currentUtterance: null,
      lastSpokenPart: null,
      started: false,
      // Delay 1 detik sebelum narasi mulai dibaca. Mencegah TTS bertabrakan
      // saat user "menyapu" telunjuk lewat banyak bagian (false-pick cepat).
      narrationDelayMs: 1000,
      pendingNarrationTimer: null,
      pendingNarrationPart: null,
    };

    // URL asset suara per organ — derive dari ORGANS registry. Tiap organ
    // module mendefinisikan audioPath sendiri di metadata-nya.
    const ORGAN_AUDIO_SRC = Object.fromEntries(
      Object.entries(ORGANS).map(([key, def]) => [key, def.audioPath])
    );

    function ensureAudioCtx() {
      if (audio.ctx) {
        if (audio.ctx.state === 'suspended') audio.ctx.resume();
        return audio.ctx;
      }
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      const ctx = new Ctx();
      audio.ctx = ctx;
      audio.masterGain = ctx.createGain();
      audio.masterGain.gain.value = audio.volume;
      audio.masterGain.connect(ctx.destination);
      // bus terpisah biar bisa mute detak tanpa pengaruh ke narasi (TTS jalan
      // di luar AudioContext, tapi tetap kita pakai pola yang sama untuk
      // konsistensi UI/state).
      audio.beatGain = ctx.createGain();
      audio.beatGain.gain.value = audio.beatEnabled ? 1.0 : 0.0;
      audio.beatGain.connect(audio.masterGain);

      // Buat <audio> element + MediaElementAudioSourceNode untuk tiap organ.
      // Dibuat sekali saat AudioContext pertama dibuat. File akan di-fetch
      // saat .play() pertama dipanggil (browser akan stream/cache otomatis).
      for (const [key, src] of Object.entries(ORGAN_AUDIO_SRC)) {
        const el = new Audio(src);
        el.loop = true;
        el.preload = 'auto';
        el.crossOrigin = 'anonymous';
        audio.organElements[key] = el;
        try {
          const node = ctx.createMediaElementSource(el);
          node.connect(audio.beatGain);
          audio.organSources[key] = node;
        } catch (e) {
          // Fallback: kalau MediaElementSource gagal, biarkan <audio> output
          // langsung ke speaker. Volume tetap pakai el.volume.
          console.warn('MediaElementSource gagal untuk', key, e);
        }
      }
      return ctx;
    }

    // Loop suara organ dengan file MP3 asli (audio elements yang sudah
    // dibuat di ensureAudioCtx). Putar yang aktif, pause yang lain.
    function startOrganAudioLoop(organKey) {
      stopOrganAudioLoop();
      if (!audio.ctx) return;
      const el = audio.organElements[organKey];
      if (!el) return;
      audio.activeOrganLoop = organKey;
      // Kalau MediaElementSource sukses dibuat, volume di-kontrol via
      // beatGain. Kalau fallback, set el.volume langsung agar tetap responsif.
      if (!audio.organSources[organKey]) {
        el.volume = (audio.enabled && audio.beatEnabled) ? audio.volume : 0;
      }
      el.currentTime = 0;
      const playPromise = el.play();
      if (playPromise && playPromise.catch) {
        playPromise.catch((err) => {
          console.warn(`Gagal play ${organKey}.mp3:`, err?.message || err);
        });
      }
    }

    function stopOrganAudioLoop() {
      if (audio.activeOrganLoop) {
        const el = audio.organElements[audio.activeOrganLoop];
        if (el) {
          el.pause();
          el.currentTime = 0;
        }
      }
      audio.activeOrganLoop = null;
    }

    // ----- Narasi (TTS) -----
    function pickIndonesianVoice() {
      if (!window.speechSynthesis) return null;
      const voices = speechSynthesis.getVoices();
      // Prioritas: voice id-ID, lalu yang nama mengandung "Indonesia"
      let v = voices.find(x => /^id(-|_)?ID/i.test(x.lang));
      if (!v) v = voices.find(x => /indones/i.test(x.name));
      // Fallback: voice apa saja
      return v || voices[0] || null;
    }

    // Jadwalkan narasi dengan delay (default 1 detik). Kalau partId berubah
    // sebelum timer habis, timer di-cancel dan dijadwal ulang — jadi user
    // bisa "ganti pilihan" tanpa narasi salah ikut diucapkan.
    function speakPart(partId) {
      if (!window.speechSynthesis) {
        console.warn('[TTS] speechSynthesis tidak tersedia di browser');
        return;
      }
      if (!audio.enabled || !audio.narrEnabled) {
        console.log('[TTS] skip: audio disabled', { enabled: audio.enabled, narrEnabled: audio.narrEnabled });
        return;
      }
      const part = getParts()[partId];
      if (!part) {
        console.warn('[TTS] partId tidak ditemukan:', partId);
        return;
      }

      // Batalkan pending narasi sebelumnya (jika ada).
      if (audio.pendingNarrationTimer) {
        clearTimeout(audio.pendingNarrationTimer);
        audio.pendingNarrationTimer = null;
      }
      audio.pendingNarrationPart = partId;

      audio.pendingNarrationTimer = setTimeout(() => {
        audio.pendingNarrationTimer = null;
        if (!audio.enabled || !audio.narrEnabled) return;
        if (audio.pendingNarrationPart !== partId) return;
        const p = getParts()[partId];
        if (!p) return;

        // Cancel utterance lama TEPAT SEBELUM speak baru. Penting: setelah
        // cancel(), Chrome kadang masuk state "stuck" di mana speak()
        // berikutnya tidak firing onstart. Workaround: pause+resume cycle
        // setelah speak() untuk "kick" engine keluar dari stuck state.
        try { speechSynthesis.cancel(); } catch (_) { /* no-op */ }

        const text = `${p.title}. ${p.desc}`;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'id-ID';
        u.rate = 1.0;
        u.pitch = 1.0;
        u.volume = audio.volume > 0 ? audio.volume : 1.0;
        if (!audio.voice) audio.voice = pickIndonesianVoice();
        if (audio.voice) u.voice = audio.voice;
        u.onstart = () => console.log('[TTS] mulai:', partId);
        u.onend = () => console.log('[TTS] selesai:', partId);
        u.onerror = (ev) => {
          const err = ev.error || ev.type;
          if (err === 'canceled' || err === 'interrupted') return;
          console.warn('[TTS] error:', err, ev);
        };
        audio.currentUtterance = u;
        audio.lastSpokenPart = partId;
        audio.pendingNarrationPart = null;
        try {
          speechSynthesis.speak(u);
          // Kick engine: pause lalu resume. Workaround Chromium bug
          // crbug.com/509488 — tanpa ini, voice Indonesia (Damayanti dkk)
          // sering stuck di queue tanpa fire onstart.
          speechSynthesis.pause();
          speechSynthesis.resume();

          // Watchdog: Chrome auto-pause utterance setelah ~15 detik. Resume
          // periodik supaya narasi panjang tidak terpotong.
          if (audio.ttsWatchdog) clearInterval(audio.ttsWatchdog);
          audio.ttsWatchdog = setInterval(() => {
            if (!speechSynthesis.speaking) {
              clearInterval(audio.ttsWatchdog);
              audio.ttsWatchdog = null;
              return;
            }
            if (speechSynthesis.paused) speechSynthesis.resume();
          }, 5000);

          console.log('[TTS] speak() called for:', partId, '| voice:', u.voice?.name || 'default', '| volume:', u.volume);
        } catch (err) {
          console.warn('[TTS] speak() throw:', err);
        }
      }, audio.narrationDelayMs);
    }

    function stopNarration() {
      if (audio.pendingNarrationTimer) {
        clearTimeout(audio.pendingNarrationTimer);
        audio.pendingNarrationTimer = null;
      }
      if (audio.ttsWatchdog) {
        clearInterval(audio.ttsWatchdog);
        audio.ttsWatchdog = null;
      }
      audio.pendingNarrationPart = null;
      if (window.speechSynthesis) speechSynthesis.cancel();
      audio.currentUtterance = null;
      audio.lastSpokenPart = null;
    }

    // Browser butuh user gesture pertama untuk membolehkan audio.
    function userKickAudio() {
      if (audio.started) return;
      ensureAudioCtx();
      if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume();
      // Load voice list (kadang baru tersedia setelah event 'voiceschanged')
      if (window.speechSynthesis) {
        if (!audio.voice) audio.voice = pickIndonesianVoice();
        speechSynthesis.onvoiceschanged = () => {
          audio.voice = pickIndonesianVoice();
          console.log('[TTS] voices loaded, picked:', audio.voice?.name, audio.voice?.lang);
        };
        // Warm up TTS engine dengan utterance kosong — beberapa browser
        // butuh ini sebelum speak() pertama yang sebenarnya jalan.
        try {
          const warmup = new SpeechSynthesisUtterance(' ');
          warmup.volume = 0;
          speechSynthesis.speak(warmup);
          console.log('[TTS] warm-up sent. Available voices:', speechSynthesis.getVoices().length);
        } catch (e) {
          console.warn('[TTS] warm-up gagal:', e);
        }
      }
      // Jika ada organ yang sudah aktif (mis. user kembali dari mode pilihan),
      // mulai loop suara organ tsb. Saat pertama kali di selector mode, tidak
      // ada organ aktif → tidak ada suara loop (selector hening).
      if (state.activeOrgan) startOrganAudioLoop(state.activeOrgan);
      audio.started = true;
      console.log('[Audio] kicked. SpeechSynthesis available:', !!window.speechSynthesis);
    }

    // ---------------------------------------------------------------------
    // [3] HEART MODEL
    // Group root agar transform (posisi/skala/rotasi) lewat satu titik.
    // Coba load GLB dulu; jika gagal → procedural heart dari primitif.
    // ---------------------------------------------------------------------
    const organContainer = new THREE.Group();
    scene.add(organContainer);

    // ---------------------------------------------------------------------
    // [3a] ORGANS — di-import dari ./js/organs/index.js. Tiap organ punya
    // file module sendiri (heart.js, lungs.js, ...) yang mendefinisikan
    // metadata, parts, builder procedural, GLB path, audio path, dan
    // visual pulse function. Lihat js/organs/heart.js sebagai contoh
    // kontrak module.
    // ---------------------------------------------------------------------

    // Helper: ambil parts dari organ yang sedang aktif. Sebelumnya ada
    // konstanta global PARTS — sekarang dinamis berdasarkan state.activeOrgan.
    function getParts() {
      if (!state || !state.activeOrgan) return {};
      return ORGANS[state.activeOrgan].parts;
    }

    // Tag mesh dengan partId & simpan warna emissive asal untuk highlight restore.
    function tagPart(mesh, partId) {
      mesh.userData.partId = partId;
      // simpan kondisi awal untuk efek highlight (emissive boost)
      if (mesh.material && mesh.material.emissive) {
        mesh.userData._origEmissive = mesh.material.emissive.getHex();
        mesh.userData._origEmissiveIntensity = mesh.material.emissiveIntensity ?? 1;
      }
    }


    let activeOrganMesh = null;
    let organReady = false;
    const loader = new GLTFLoader();

    function fitToUnitBox(obj) {
      // Normalisasi ukuran model: bounding box → muat di ~0.8 unit, di-center ke origin.
      const bbox = new THREE.Box3().setFromObject(obj);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      bbox.getSize(size);
      bbox.getCenter(center);
      const maxDim = Math.max(size.x, size.y, size.z);
      if (maxDim > 0) {
        const s = 0.8 / maxDim;
        obj.scale.multiplyScalar(s);
        // Geser ke origin setelah scale diterapkan
        obj.position.sub(center.multiplyScalar(s));
      }
    }

    // Hapus organ aktif dari container — dispose geometry & material.
    function clearActiveOrgan() {
      if (activeOrganMesh) {
        organContainer.remove(activeOrganMesh);
        activeOrganMesh.traverse((o) => {
          if (o.geometry) o.geometry.dispose?.();
          if (o.material) {
            if (Array.isArray(o.material)) o.material.forEach(m => m.dispose?.());
            else o.material.dispose?.();
          }
        });
        activeOrganMesh = null;
      }
      organReady = false;
    }

    // Tag setiap mesh GLB berdasarkan glbMeshMap dari organ def.
    // Untuk model satu-mesh (heart): buat invisible zone-mesh per anatomi
    // supaya proximity picker bisa detect bagian. Zone mesh sangat kecil
    // (sphere r=0.001, invisible) ditempatkan di posisi lokal yang sudah
    // dikalibrasi, dan di-tag userData.partId seperti mesh procedural biasa.
    // Buat zone-sphere untuk setiap zona anatomi GLB.
    // Zone sphere normalnya TIDAK TERLIHAT (visible=false, depthWrite=false).
    // Saat partId di-highlight, hanya zone milik partId itu yang di-set visible
    // dengan warna semi-transparan — memberi feedback spasial yang tepat.
    function _makeZoneSphere(partId, center, color, radius) {
      const geo = new THREE.SphereGeometry(radius, 16, 12);
      const mat = new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity: 0.35,
        depthWrite: false,
        visible: false,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(...center);
      mesh.userData.partId = partId;
      mesh.userData.isZoneSphere = true;
      return mesh;
    }

    // Upgrade material GLB ke MeshStandardMaterial supaya lighting scene aktif.
    function _upgradeGlbMaterials(scene, roughness = 0.65, metalness = 0.05) {
      scene.traverse((o) => {
        if (!o.isMesh || o.userData.isZoneSphere) return;
        const upgrade = (m) => {
          if (!m || m.isMeshStandardMaterial) return m;
          return new THREE.MeshStandardMaterial({
            map: m.map || null,
            normalMap: m.normalMap || null,
            roughnessMap: m.roughnessMap || null,
            metalnessMap: m.metalnessMap || null,
            roughness,
            metalness,
          });
        };
        if (Array.isArray(o.material)) {
          o.material = o.material.map(upgrade);
        } else {
          o.material = upgrade(o.material);
        }
      });
    }

    // Tag mesh GLB dengan zone-sphere berdasarkan glbMeshMap & glbZones dari def.
    function tagGlbMeshes(scene, def) {
      if (!def.glbMeshMap) return;

      const isSingleMesh = Object.values(def.glbMeshMap).includes('glb_heart_single');

      if (isSingleMesh && Array.isArray(def.glbZones)) {
        // Jantung: 1 mesh — buat zone-sphere per bagian anatomi.
        _upgradeGlbMaterials(scene, 0.65, 0.05);
        for (const z of def.glbZones) {
          const color = def.parts[z.partId]?.color ?? 0xffffff;
          const sphere = _makeZoneSphere(z.partId, z.center, color, 0.09);
          scene.add(sphere);
        }
        return;
      }

      // Paru-paru: 2 mesh terpisah — match nama, lalu buat zone-sphere per lobus.
      _upgradeGlbMaterials(scene, 0.7, 0.03);
      const addedZones = new Set();
      scene.traverse((o) => {
        if (!o.isMesh || o.userData.isZoneSphere) return;
        const meshName = o.name || '';
        let zoneKey = null;
        for (const [pattern, key] of Object.entries(def.glbMeshMap)) {
          if (meshName.toLowerCase().includes(pattern.toLowerCase())) {
            zoneKey = key;
            break;
          }
        }
        if (!zoneKey || addedZones.has(zoneKey)) return;
        addedZones.add(zoneKey);
        const zones = def.glbZones?.[zoneKey];
        if (!zones) return;
        for (const z of zones) {
          const color = def.parts[z.partId]?.color ?? 0xffffff;
          const sphere = _makeZoneSphere(z.partId, z.center, color, 0.1);
          scene.add(sphere);
        }
      });
    }

    // Spawn organ ke organContainer. Coba GLB dulu kalau ada, kalau gagal
    // pakai procedural builder dari organ module.
    function spawnOrgan(organKey) {
      clearActiveOrgan();
      const def = ORGANS[organKey];
      if (!def) return;
      state.activeOrgan = organKey;

      const useProcedural = () => {
        if (!def.build) return;
        activeOrganMesh = def.build({ THREE, tagPart });
        organContainer.add(activeOrganMesh);
        organReady = true;
      };

      if (def.glbPath) {
        loader.load(
          def.glbPath,
          (gltf) => {
            if (state.activeOrgan !== organKey) return;
            console.log(`[GLB] loaded: ${def.glbPath}`);
            activeOrganMesh = gltf.scene;
            fitToUnitBox(activeOrganMesh);
            tagGlbMeshes(activeOrganMesh, def);
            organContainer.add(activeOrganMesh);
            organReady = true;
          },
          (xhr) => {
            if (xhr.total) {
              console.log(`[GLB] loading ${def.glbPath}: ${Math.round(xhr.loaded / xhr.total * 100)}%`);
            }
          },
          (err) => {
            console.warn(`[GLB] gagal load ${def.glbPath}:`, err?.message || err);
            console.warn('[GLB] fallback ke procedural model');
            useProcedural();
          }
        );
      } else {
        useProcedural();
      }
    }


    // ---------------------------------------------------------------------
    // [3c] SELECTOR — dua box 3D side-by-side untuk memilih organ.
    // Box dibuat dari plane + text canvas (label "Jantung" / "Paru-paru"
    // dengan icon). Tunjuk dengan telunjuk → spawn organ tersebut.
    // ---------------------------------------------------------------------
    const selectorGroup = new THREE.Group();
    scene.add(selectorGroup);

    // Helper: rounded rect path (re-usable)
    function _roundRectPath(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // Helper: parse hex 0xRRGGBB jadi { r, g, b }
    function _rgbFromHex(hex) {
      return {
        r: (hex >> 16) & 0xff,
        g: (hex >> 8) & 0xff,
        b: hex & 0xff,
      };
    }

    function makeSelectorBox(organKey, xOffset) {
      const def = ORGANS[organKey];
      // Canvas resolusi tinggi untuk teks crisp di plane 3D
      const W = 640, H = 800;
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d');
      const colorHex = '#' + def.color.toString(16).padStart(6, '0');
      const rgb = _rgbFromHex(def.color);

      function redraw(hover, progress = 0) {
        ctx.clearRect(0, 0, W, H);

        // ===== Card background (linear gradient + rounded) =====
        const pad = 28;
        const radius = 56;
        const cardX = pad, cardY = pad;
        const cardW = W - pad * 2, cardH = H - pad * 2;

        // Vertical gradient: dark top → slightly tinted bottom dengan warna organ
        const bgGrad = ctx.createLinearGradient(0, cardY, 0, cardY + cardH);
        if (hover) {
          bgGrad.addColorStop(0, `rgba(${rgb.r * 0.15}, ${rgb.g * 0.15}, ${rgb.b * 0.15}, 1)`);
          bgGrad.addColorStop(1, `rgba(${rgb.r * 0.35}, ${rgb.g * 0.35}, ${rgb.b * 0.35}, 1)`);
        } else {
          bgGrad.addColorStop(0, 'rgb(18, 22, 38)');
          bgGrad.addColorStop(1, `rgba(${rgb.r * 0.18}, ${rgb.g * 0.18}, ${rgb.b * 0.18}, 1)`);
        }
        _roundRectPath(ctx, cardX, cardY, cardW, cardH, radius);
        ctx.fillStyle = bgGrad;
        ctx.fill();

        // Glow border (luar) — efek halo
        ctx.save();
        ctx.shadowColor = colorHex;
        ctx.shadowBlur = hover ? 32 : 14;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;
        ctx.strokeStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${hover ? 1.0 : 0.7})`;
        ctx.lineWidth = hover ? 6 : 4;
        _roundRectPath(ctx, cardX, cardY, cardW, cardH, radius);
        ctx.stroke();
        ctx.restore();

        // Inner highlight stroke (efek glass)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 2;
        _roundRectPath(ctx, cardX + 6, cardY + 6, cardW - 12, cardH - 12, radius - 6);
        ctx.stroke();

        // ===== Top accent bar (pill kecil bertuliskan organ tag) =====
        const tagText = organKey.toUpperCase();
        ctx.font = 'bold 24px "Segoe UI", -apple-system, Arial, sans-serif';
        const tagMetrics = ctx.measureText(tagText);
        const tagPad = 18;
        const tagW = tagMetrics.width + tagPad * 2;
        const tagH = 40;
        const tagX = (W - tagW) / 2;
        const tagY = cardY + 48;
        _roundRectPath(ctx, tagX, tagY, tagW, tagH, tagH / 2);
        ctx.fillStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.18)`;
        ctx.fill();
        ctx.strokeStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.5)`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = `rgba(${Math.min(255, rgb.r + 80)}, ${Math.min(255, rgb.g + 80)}, ${Math.min(255, rgb.b + 80)}, 1)`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(tagText, W / 2, tagY + tagH / 2 + 2);

        // ===== Icon container (lingkaran dengan radial gradient) =====
        const iconCx = W / 2;
        const iconCy = H / 2 - 40;
        const iconR = 150;

        // Lingkaran container icon — solid opaque gradient (tidak ada
        // outer halo radial yang sebelumnya membentuk ring transparan
        // di sekeliling icon container).
        ctx.beginPath();
        ctx.arc(iconCx, iconCy, iconR, 0, Math.PI * 2);
        const circGrad = ctx.createRadialGradient(iconCx - 30, iconCy - 30, 20, iconCx, iconCy, iconR);
        // Solid (opacity 1) supaya tidak transparan ke layer di belakang
        circGrad.addColorStop(0, `rgba(${Math.min(255, rgb.r + 30)}, ${Math.min(255, rgb.g + 30)}, ${Math.min(255, rgb.b + 30)}, 1)`);
        circGrad.addColorStop(1, `rgba(${rgb.r * 0.5}, ${rgb.g * 0.5}, ${rgb.b * 0.5}, 1)`);
        ctx.fillStyle = circGrad;
        ctx.fill();
        // Glow tipis di sekeliling lingkaran (lewat shadow, bukan radial fill,
        // jadi tidak meninggalkan ring transparan)
        ctx.save();
        ctx.shadowColor = colorHex;
        ctx.shadowBlur = hover ? 24 : 12;
        ctx.strokeStyle = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.9)`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(iconCx, iconCy, iconR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        // Icon emoji di tengah container
        ctx.font = '180px "Segoe UI Emoji", "Apple Color Emoji", Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        // Sedikit shadow drop untuk dimensi
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fillText(def.icon, iconCx + 3, iconCy + 4);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(def.icon, iconCx, iconCy);

        // Progress ring (di luar icon container)
        if (hover && progress > 0) {
          const ringR = iconR + 26;
          ctx.lineWidth = 8;
          ctx.lineCap = 'round';
          ctx.strokeStyle = colorHex;
          ctx.shadowColor = colorHex;
          ctx.shadowBlur = 18;
          ctx.beginPath();
          ctx.arc(iconCx, iconCy, ringR, -Math.PI / 2, -Math.PI / 2 + progress * Math.PI * 2);
          ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.lineCap = 'butt';
        }

        // ===== Title (besar, modern dengan letter-spacing) =====
        ctx.fillStyle = '#ffffff';
        ctx.font = '600 64px "Segoe UI", -apple-system, Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        // Letter-spacing manual: gambar per karakter
        const title = def.title;
        const spacing = 2;
        const titleY = cardY + cardH - 140;
        const titleMetrics = ctx.measureText(title);
        // Standard letter-spacing approach (just draw with subtle shadow)
        ctx.shadowColor = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.5)`;
        ctx.shadowBlur = hover ? 12 : 6;
        ctx.fillText(title, W / 2, titleY);
        ctx.shadowBlur = 0;

        // ===== CTA / status hint =====
        const ctaY = cardY + cardH - 70;
        const ctaText = hover ? 'TAHAN UNTUK PILIH' : 'TUNJUK UNTUK MEMILIH';
        ctx.font = '500 22px "Segoe UI", -apple-system, Arial, sans-serif';
        ctx.fillStyle = hover
          ? `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 1)`
          : 'rgba(255, 255, 255, 0.5)';
        ctx.fillText(ctaText, W / 2, ctaY);

        // Tiny dot indicator di kiri-kanan CTA
        const dotR = 3;
        const dotSpacing = ctx.measureText(ctaText).width / 2 + 24;
        ctx.fillStyle = ctx.fillStyle;
        ctx.beginPath();
        ctx.arc(W / 2 - dotSpacing, ctaY, dotR, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(W / 2 + dotSpacing, ctaY, dotR, 0, Math.PI * 2);
        ctx.fill();
      }
      redraw(false);

      const tex = new THREE.CanvasTexture(c);
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.anisotropy = 4;
      const mat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        side: THREE.DoubleSide,
      });
      // Aspect ratio sesuai canvas (4:5 portrait) — lebih modern dari square
      const widthW = 0.9;
      const heightW = widthW * (H / W);
      const geo = new THREE.PlaneGeometry(widthW, heightW);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(xOffset, 0, 0);
      mesh.userData.organKey = organKey;
      mesh.userData.redraw = redraw;
      mesh.userData.canvas = c;
      mesh.userData.texture = tex;
      mesh.userData.boxRadius = widthW * 0.65;
      return mesh;
    }

    // Derive posisi box dari ORGAN_ORDER — center jika 1, kiri/kanan jika 2,
    // dst. Spacing 1.2 unit antar box.
    const SELECTOR_SPACING = 1.2;
    const selectorBoxes = ORGAN_ORDER.map((key, i) => {
      const offset = (i - (ORGAN_ORDER.length - 1) / 2) * SELECTOR_SPACING;
      return makeSelectorBox(key, offset);
    });
    for (const b of selectorBoxes) selectorGroup.add(b);
    // Angkat sedikit ke atas agar tidak overlap dengan hint bar & toolbar
    // yang ada di bottom layar.
    selectorGroup.position.y = 0.15;

    function setSelectorVisible(visible) {
      selectorGroup.visible = visible;
      // Sembunyikan hint bar saat selector aktif — instruksi sudah tampil
      // di dalam box pilihan.
      hintEl.style.display = visible ? 'none' : 'block';
    }

    function setSelectorHover(organKey) {
      for (const b of selectorBoxes) {
        const isHover = b.userData.organKey === organKey;
        b.userData.redraw(isHover, 0);
        b.userData.texture.needsUpdate = true;
        // Slight scale boost saat hover
        const targetScale = isHover ? 1.1 : 1.0;
        b.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.3);
      }
    }

    // Update visual progress ring di box yang sedang di-hover. Dipanggil
    // tiap frame oleh tickSelector dengan nilai 0..1.
    function updateSelectorProgress(organKey, progress) {
      for (const b of selectorBoxes) {
        const isHover = b.userData.organKey === organKey;
        if (isHover) {
          b.userData.redraw(true, progress);
          b.userData.texture.needsUpdate = true;
        }
      }
    }

    // ---------------------------------------------------------------------
    // [3b] 3D LABEL — sprite billboard yang menampilkan judul + deskripsi
    // bagian terpilih. Selalu menghadap kamera (THREE.Sprite). Diletakkan
    // di scene root (bukan organContainer) supaya skala teks tidak mengikuti
    // scale jantung saat user pinch resize.
    // ---------------------------------------------------------------------
    const labelCanvas = document.createElement('canvas');
    labelCanvas.width = 1024;
    labelCanvas.height = 512;
    const labelCtx = labelCanvas.getContext('2d');
    const labelTexture = new THREE.CanvasTexture(labelCanvas);
    labelTexture.minFilter = THREE.LinearFilter;
    labelTexture.magFilter = THREE.LinearFilter;
    const labelSpriteMat = new THREE.SpriteMaterial({
      map: labelTexture,
      transparent: true,
      depthTest: false,
      depthWrite: false,
      opacity: 0,
    });
    const labelSprite = new THREE.Sprite(labelSpriteMat);
    labelSprite.scale.set(1.2, 0.6, 1);
    labelSprite.renderOrder = 999;
    scene.add(labelSprite);

    // Garis penghubung dari label ke bagian (visual cue posisi).
    const leaderGeo = new THREE.BufferGeometry();
    leaderGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
    const leaderMat = new THREE.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0,
    });
    const leaderLine = new THREE.Line(leaderGeo, leaderMat);
    leaderLine.renderOrder = 998;
    scene.add(leaderLine);

    // Render judul + deskripsi (multiline) ke canvas. Dipanggil saat part
    // terpilih berganti.
    function drawLabel(partId) {
      const part = getParts()[partId];
      if (!part) return;
      const W = labelCanvas.width;
      const H = labelCanvas.height;
      const ctx = labelCtx;
      ctx.clearRect(0, 0, W, H);

      // Background pill
      const pad = 28;
      const radius = 32;
      ctx.fillStyle = 'rgba(15, 20, 35, 0.92)';
      ctx.strokeStyle = '#' + part.color.toString(16).padStart(6, '0');
      ctx.lineWidth = 6;
      roundRect(ctx, pad, pad, W - pad * 2, H - pad * 2, radius);
      ctx.fill();
      ctx.stroke();

      // Judul
      ctx.fillStyle = '#' + part.color.toString(16).padStart(6, '0');
      ctx.font = 'bold 64px "Segoe UI", Arial, sans-serif';
      ctx.textBaseline = 'top';
      ctx.textAlign = 'left';
      ctx.fillText(part.title, pad + 32, pad + 24);

      // Garis pemisah
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(pad + 32, pad + 108);
      ctx.lineTo(W - pad - 32, pad + 108);
      ctx.stroke();

      // Deskripsi (word wrap)
      ctx.fillStyle = '#f0f0f0';
      ctx.font = '34px "Segoe UI", Arial, sans-serif';
      wrapText(ctx, part.desc, pad + 32, pad + 132, W - pad * 2 - 64, 44);

      labelTexture.needsUpdate = true;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      let yy = y;
      for (let n = 0; n < words.length; n++) {
        const testLine = line ? line + ' ' + words[n] : words[n];
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && line) {
          ctx.fillText(line, x, yy);
          line = words[n];
          yy += lineHeight;
        } else {
          line = testLine;
        }
      }
      if (line) ctx.fillText(line, x, yy);
    }

    // Untuk menemukan bagian yang ditunjuk: ambil semua mesh ber-partId,
    // hitung jarak indexTip → titik pada bounding-sphere mesh dalam world space.
    // Lebih murah dari raycast & cocok untuk "proximity pick" gestural.
    function getPickableMeshes() {
      const out = [];
      if (!activeOrganMesh) return out;
      activeOrganMesh.traverse((o) => {
        if (o.isMesh && o.userData.partId) out.push(o);
      });
      return out;
    }

    function setHighlight(partId) {
      if (!activeOrganMesh) return;
      const def = state.activeOrgan ? ORGANS[state.activeOrgan] : null;
      const isGlb = !!(def?.glbMeshMap);

      if (isGlb) {
        // GLB: toggle visibility zone-sphere milik partId.
        // Zone lain disembunyikan — highlight spasial tepat per zona.
        activeOrganMesh.traverse((o) => {
          if (!o.isMesh || !o.userData.isZoneSphere) return;
          o.material.visible = (partId && o.userData.partId === partId);
        });
        return;
      }

      // Procedural: emissive per-mesh seperti sebelumnya.
      const meshes = getPickableMeshes();
      for (const m of meshes) {
        const isOn = m.userData.partId === partId;
        const mat = m.material;
        if (!mat || !mat.emissive) continue;
        if (isOn) {
          mat.emissive.setHex(getParts()[partId].color);
          mat.emissiveIntensity = 0.6;
        } else {
          mat.emissive.setHex(0x000000);
          mat.emissiveIntensity = 1;
        }
      }
    }

    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
      // Hand canvas backing-store sekarang di-set ke dimensi video frame
      // (di drawHandSkeleton), CSS yang men-scale ke viewport. Tidak ada
      // yang perlu di-handle di sini.
    }
    window.addEventListener('resize', onResize);
    onResize();

    // ---------------------------------------------------------------------
    // [Hand Skeleton Overlay] — pendekatan sama dengan naruto/index.html
    // ---------------------------------------------------------------------
    // Canvas berukuran = videoWidth × videoHeight (frame native). Landmark
    // MediaPipe (0..1) langsung 1:1 dengan pixel canvas — tidak butuh
    // konversi manual. CSS object-fit:cover + scaleX(-1) menscale+mirror
    // canvas sama persis seperti video di belakangnya.
    //
    // drawConnectors & drawLandmarks dari @mediapipe/drawing_utils (loaded
    // sebagai global script). HAND_CONNECTIONS juga global dari hands.js.
    function drawHandSkeleton() {
      // Match canvas size to video frame (kalau video belum ready, skip)
      if (!videoEl.videoWidth || !videoEl.videoHeight) return;
      if (handCanvas.width !== videoEl.videoWidth) {
        handCanvas.width = videoEl.videoWidth;
        handCanvas.height = videoEl.videoHeight;
      }
      handCtx.save();
      handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);
      if (!latestHands.length) {
        handCtx.restore();
        return;
      }

      for (const hand of latestHands) {
        // Warna berdasar gesture aktif (feedback visual)
        let boneColor = '#00d4ff';   // cyan default (sama dengan naruto)
        if (hand.isFist) boneColor = '#f97316';            // orange grab
        else if (hand.isTwoFingerRotate) boneColor = '#a78bfa'; // purple rotate
        else if (hand.isThumbsUp) boneColor = '#fbbf24';   // amber thumb
        else if (hand.isPointing) boneColor = '#4ade80';   // green pointing

        handCtx.save();
        handCtx.shadowBlur = 10;
        handCtx.shadowColor = boneColor;
        drawConnectors(handCtx, hand.lm, HAND_CONNECTIONS, {
          color: boneColor,
          lineWidth: 3,
        });
        drawLandmarks(handCtx, hand.lm, {
          color: '#ffffff',
          lineWidth: 1,
          radius: 2,
        });
        handCtx.restore();
      }
      handCtx.restore();
    }

    // ---------------------------------------------------------------------
    // [4] GESTURE HELPERS — sama dengan webar-handtracking
    // ---------------------------------------------------------------------
    function dist(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const dz = (a.z || 0) - (b.z || 0);
      return Math.sqrt(dx * dx + dy * dy + dz * dz);
    }

    function palmCenter(lm) {
      const idxs = [0, 5, 9, 13, 17];
      let x = 0, y = 0, z = 0;
      for (const i of idxs) {
        x += lm[i].x; y += lm[i].y; z += lm[i].z || 0;
      }
      return { x: x / idxs.length, y: y / idxs.length, z: z / idxs.length };
    }

    function palmSize(lm) {
      return dist(lm[0], lm[9]);
    }

    function isClosedFist(lm) {
      if (isPointing(lm)) return false;
      const wrist = lm[0];
      const tips = [8, 12, 16, 20];
      const mcps = [5, 9, 13, 17];
      let folded = 0;
      for (let i = 0; i < tips.length; i++) {
        const dTip = dist(lm[tips[i]], wrist);
        const dMcp = dist(lm[mcps[i]], wrist);
        if (dTip < dMcp * 1.05) folded++;
      }
      return folded >= 3;
    }

    function isPointing(lm) {
      // Exclusive dari two-finger rotate: kalau jari tengah juga extended,
      // ini bukan "pointing untuk pick", tapi gesture rotate.
      if (isTwoFingerRotate(lm)) return false;

      const wrist = lm[0];
      const indexTip = lm[8];
      const indexMcp = lm[5];
      const otherTips = [12, 16, 20];
      const otherMcps = [9, 13, 17];

      const dIndexTip = dist(indexTip, wrist);
      const dIndexMcp = dist(indexMcp, wrist);
      const indexExtended = dIndexTip > dIndexMcp * 1.2;

      let folded = 0;
      for (let i = 0; i < otherTips.length; i++) {
        const dTip = dist(lm[otherTips[i]], wrist);
        const dMcp = dist(lm[otherMcps[i]], wrist);
        if (dTip < dMcp * 1.05) folded++;
      }
      return indexExtended && folded >= 2;
    }

    // Thumbs up: ibu jari extended ke atas, jari lain terlipat.
    // Dipakai untuk despawn organ aktif & kembali ke selector.
    function isThumbsUp(lm) {
      const wrist = lm[0];
      const thumbTip = lm[4], thumbIP = lm[3];
      const tips = [8, 12, 16, 20];
      const mcps = [5, 9, 13, 17];

      // 4 jari (selain ibu jari) harus terlipat
      let folded = 0;
      for (let i = 0; i < tips.length; i++) {
        if (dist(lm[tips[i]], wrist) < dist(lm[mcps[i]], wrist) * 1.05) folded++;
      }
      if (folded < 4) return false;

      // Ibu jari extended (menjauh dari palm) & menunjuk ke atas
      // (koordinat y MediaPipe: makin kecil = makin ke atas).
      const palm = palmCenter(lm);
      const ps = palmSize(lm);
      const thumbExtended = dist(thumbTip, palm) > ps * 1.15;
      const thumbUp = thumbTip.y < thumbIP.y;

      return thumbExtended && thumbUp;
    }

    // Two-finger rotate gesture: telunjuk + jari tengah keduanya extended
    // dan UJUNGNYA berdekatan (rapat), sementara ring & pinky terlipat.
    // Dipakai eksklusif untuk rotasi jantung — agar tidak konflik dengan
    // "tunjuk dengan telunjuk saja", kita cek jari tengah extended sebagai
    // pembeda utama.
    function isTwoFingerRotate(lm) {
      const wrist = lm[0];
      const indexTip = lm[8], indexMcp = lm[5];
      const middleTip = lm[12], middleMcp = lm[9];
      const ringTip = lm[16], ringMcp = lm[13];
      const pinkyTip = lm[20], pinkyMcp = lm[17];

      // Telunjuk & tengah harus extended (tip lebih jauh dari wrist dari MCP-nya)
      const indexExtended = dist(indexTip, wrist) > dist(indexMcp, wrist) * 1.2;
      const middleExtended = dist(middleTip, wrist) > dist(middleMcp, wrist) * 1.2;
      if (!indexExtended || !middleExtended) return false;

      // Ring & pinky harus terlipat
      const ringFolded = dist(ringTip, wrist) < dist(ringMcp, wrist) * 1.1;
      const pinkyFolded = dist(pinkyTip, wrist) < dist(pinkyMcp, wrist) * 1.1;
      if (!ringFolded || !pinkyFolded) return false;

      // Telunjuk & tengah harus RAPAT (tip-to-tip dekat). Threshold relatif
      // terhadap panjang telunjuk biar tahan terhadap jarak tangan ke kamera.
      const indexLen = dist(indexTip, indexMcp);
      const tipGap = dist(indexTip, middleTip);
      return tipGap < indexLen * 0.55;
    }

    function isOpenHand(lm) {
      const palm = palmCenter(lm);
      const tips = [8, 12, 16, 20];
      const ps = palmSize(lm);
      let extended = 0;
      for (const t of tips) {
        if (dist(lm[t], palm) > ps * 1.3) extended++;
      }
      return extended >= 3;
    }

    // ===== Video frame ↔ viewport NDC mapping (untuk hit-test 3D) =====
    // Video ditampilkan dengan `object-fit: cover` → frame di-crop agar
    // memenuhi viewport, mempertahankan center. Hit-test untuk selector
    // boxes 3D & picker organ butuh koordinat NDC viewport yang accurate.
    // (Skeleton drawing TIDAK pakai helper ini — pakai pendekatan canvas
    // = videoSize + CSS cover, lihat drawHandSkeleton.)
    function getVideoCoverInfo() {
      const vw = handCanvas.clientWidth;
      const vh = handCanvas.clientHeight;
      const fw = videoEl.videoWidth || 640;
      const fh = videoEl.videoHeight || 480;
      const scale = Math.max(vw / fw, vh / fh);
      const visibleFw = vw / scale; // lebar frame yang terlihat (dalam unit frame)
      const visibleFh = vh / scale;
      const cropX = (fw - visibleFw) / 2; // bagian frame yang di-crop sisi kiri
      const cropY = (fh - visibleFh) / 2;
      return { vw, vh, fw, fh, scale, visibleFw, visibleFh, cropX, cropY };
    }

    // Landmark MediaPipe (frame fraction 0..1) → screen px (account for
    // mirror CSS scaleX(-1) + cover crop).
    function videoToScreen(p) {
      const info = getVideoCoverInfo();
      // Konversi p.x (0..1 frame) → posisi pixel di frame asli
      const framePx = p.x * info.fw;
      // Posisi pixel di visible frame (offset cropX)
      const visibleFramePx = framePx - info.cropX;
      // Skala ke viewport pixel
      let screenX = visibleFramePx * info.scale;
      // Mirror horizontal (CSS scaleX(-1))
      screenX = info.vw - screenX;

      const frameYpx = p.y * info.fh;
      const visibleFrameYpx = frameYpx - info.cropY;
      const screenY = visibleFrameYpx * info.scale;

      return { x: screenX, y: screenY };
    }

    // Landmark → NDC viewport (untuk unproject ke world).
    function videoToNdc(p) {
      const s = videoToScreen(p);
      const info = getVideoCoverInfo();
      return {
        x: (s.x / info.vw) * 2 - 1,
        y: -((s.y / info.vh) * 2 - 1),
      };
    }

    // Konversi koordinat MediaPipe ke world space di depth tetap, pakai
    // transform cover-aware supaya konsisten dengan skeleton overlay.
    // Default depth = 2.0 supaya world-z tip ≈ 0 (sama dengan plane organ
    // di scene). Penting untuk hit-test: kalau tip dan organ di plane z
    // berbeda, jarak Euclidean punya komponen z konstan yang membuat
    // PICK_RADIUS_BONUS kecil tidak pernah cocok.
    function landmarkToWorld(p, depth = 2.0) {
      const ndc = videoToNdc(p);
      const v = new THREE.Vector3(ndc.x, ndc.y, 0.5);
      v.unproject(camera);
      const dir = v.sub(camera.position).normalize();
      return camera.position.clone().add(dir.multiplyScalar(depth));
    }

    // ---------------------------------------------------------------------
    // [5] STATE
    // Tanpa state-machine berat seperti webar-handtracking. Cukup mode flags:
    //   GRAB    → kalau ada fist dekat & terkunci ke tangan
    //   PINCH   → kalau dua telunjuk aktif, set skala dari rasio jarak
    //   ROTATE  → kalau ada gesture "two-finger rapat" → drag tangan = rotasi
    //   PICK    → kalau satu telunjuk dekat sebuah part → highlight + label
    //   IDLE    → tidak ada interaksi aktif
    // ---------------------------------------------------------------------
    const SPAWN_POS = new THREE.Vector3(0, 0, 0);
    const SPAWN_SCALE = 1.0;

    const state = {
      // App state: 'SELECTING' (box pilihan tampil) atau 'ACTIVE' (organ tampil).
      appMode: 'SELECTING',
      activeOrgan: null,           // 'heart' | 'lungs' saat ACTIVE
      selectorHover: null,         // organ key yang sedang di-hover di selector
      selectorPickStableUntil: 0,
      thumbsLatched: false,        // edge-detect thumbs up (sekali per gesture)

      pos: SPAWN_POS.clone(),
      smoothPos: SPAWN_POS.clone(),
      scale: SPAWN_SCALE,
      targetScale: SPAWN_SCALE,
      rotX: 0,
      rotY: 0,
      animateBeat: true,
      // grab
      grabActive: false,
      grabReleaseUntil: 0,
      // pinch
      pinchActive: false,
      pinchBaseDist: 0,
      pinchBaseScale: 1,
      // two-finger rotate
      rotateActive: false,
      rotateLastPos: null,
      // part picker
      selectedPart: null,
      pickStableUntil: 0,
      // highlight
      highlight: 0,
    };

    const GRAB_DIST_WORLD = 0.55;
    const RELEASE_DEBOUNCE_MS = 200;
    // Toleransi jarak dari UJUNG TELUNJUK (lm[8]) ke permukaan bbox part.
    // Kecil (0.05 world unit ≈ 5cm dunia virtual) supaya hover hanya terjadi
    // saat tip benar-benar menyentuh atau hampir menyentuh part, bukan dari
    // sekedar mendekati area-nya.
    const PICK_RADIUS_BONUS = 0.05;
    const PICK_STICKY_MS = 350;      // hold label sebentar setelah telunjuk lepas
    const SMOOTHING = 0.4;
    const SCALE_MIN = 0.3;
    const SCALE_MAX = 3.0;
    const SCALE_LERP_SPEED = 8.0;
    const ROTATE_SENSITIVITY = 3.0;  // konversi delta world-x/y → radian rotasi
    const BOUND = 1.6;

    function setMode(m) {
      modeLabel.textContent = m;
    }

    // Audio (beat & narasi) selalu aktif — toggle UI sudah dihapus.
    // userKickAudio dipanggil otomatis di animate() saat tangan pertama
    // kali terdeteksi.

    // ---------------------------------------------------------------------
    // [6] MEDIAPIPE RESULTS
    // ---------------------------------------------------------------------
    let latestHands = [];

    function onResults(results) {
      const hands = [];
      if (results.multiHandLandmarks && results.multiHandedness) {
        for (let i = 0; i < results.multiHandLandmarks.length; i++) {
          const lm = results.multiHandLandmarks[i];
          const label = results.multiHandedness[i].label;
          const palm = palmCenter(lm);
          hands.push({
            lm,
            label,
            palm,
            palmWorld: landmarkToWorld(palm),
            indexTipWorld: landmarkToWorld(lm[8]),
            // posisi tengah antara telunjuk & jari tengah (titik pivot
            // gesture rotate two-finger) — di-precompute biar konsisten.
            twoFingerCenter: {
              x: (lm[8].x + lm[12].x) * 0.5,
              y: (lm[8].y + lm[12].y) * 0.5,
              z: ((lm[8].z || 0) + (lm[12].z || 0)) * 0.5,
            },
            twoFingerCenterWorld: landmarkToWorld({
              x: (lm[8].x + lm[12].x) * 0.5,
              y: (lm[8].y + lm[12].y) * 0.5,
            }),
            isFist: isClosedFist(lm),
            isOpen: isOpenHand(lm),
            isPointing: isPointing(lm),
            isTwoFingerRotate: isTwoFingerRotate(lm),
            isThumbsUp: isThumbsUp(lm),
          });
        }
      }
      latestHands = hands;
    }

    // ---------------------------------------------------------------------
    // [7] UPDATE LOOP
    // ---------------------------------------------------------------------
    let lastFrame = performance.now();
    let fpsAccum = 0, fpsCount = 0;

    function updateHud() {
      handsCountEl.textContent = String(latestHands.length);
      handsCountEl.className = latestHands.length > 0 ? 'ok' : 'muted';

      const fmt = (h) => {
        if (!h) return ['—', 'muted'];
        if (h.isThumbsUp) return ['Jempol ke atas 👍', 'hot'];
        if (h.isFist) return ['Menggenggam ✊', 'hot'];
        if (h.isTwoFingerRotate) return ['Dua jari rapat ✌️', 'hot'];
        if (h.isPointing) return ['Menunjuk 👉', 'ok'];
        if (h.isOpen) return ['Terbuka ✋', 'ok'];
        return ['Netral', 'warn'];
      };
      const left = latestHands.find(h => h.label === 'Left');
      const right = latestHands.find(h => h.label === 'Right');
      const [lt, lc] = fmt(left);
      const [rt, rc] = fmt(right);
      gestureLEl.textContent = lt;
      gestureLEl.className = lc;
      gestureREl.textContent = rt;
      gestureREl.className = rc;

      scaleLabel.textContent = state.scale.toFixed(2) + 'x';
    }

    // Picker selector: pakai hit-test 2D di NDC (screen-space). Lebih reliable
    // dari 3D distance karena depth telunjuk (z dari unproject) tidak akurat
    // — telunjuk diproyeksi pada depth tetap, sementara box ada di z=0,
    // sehingga 3D distance selalu punya komponen z tetap yang membuat hit-test
    // 3D sensitif terhadap posisi awal. Proyeksi NDC menyelesaikan ini.
    function tickSelector(now) {
      const pointing = latestHands.find(h => h.isPointing);
      let hovered = null;
      if (pointing) {
        // Proyeksi ujung telunjuk ke NDC (sama frustum dengan box)
        const tipNdc = pointing.indexTipWorld.clone().project(camera);

        let bestDist = Infinity;
        for (const b of selectorBoxes) {
          // Proyeksi center box ke NDC
          const boxWorld = new THREE.Vector3();
          b.getWorldPosition(boxWorld);
          const boxNdc = boxWorld.project(camera);
          // Jarak 2D di NDC (-1..1 di kedua sumbu)
          const dx = tipNdc.x - boxNdc.x;
          const dy = tipNdc.y - boxNdc.y;
          const d2 = Math.sqrt(dx * dx + dy * dy);
          // Threshold relatif ukuran NDC. Box size ~0.9 di world pada
          // depth ~2 unit → NDC half-extent ≈ 0.3. Pakai 0.28 sebagai
          // radius hit (sedikit lebih kecil dari edge agar tidak overlap).
          if (d2 < 0.28 && d2 < bestDist) {
            bestDist = d2;
            hovered = b.userData.organKey;
          }
        }
      }

      if (hovered !== state.selectorHover) {
        state.selectorHover = hovered;
        setSelectorHover(hovered);
        if (hovered) {
          state.selectorPickStableUntil = now + 800; // tahan 0.8s sebelum pilih
          hintEl.textContent = `👉 ${ORGANS[hovered].title} — tahan untuk pilih`;
        } else {
          hintEl.textContent = '👉 Tunjuk salah satu kotak untuk memilih organ';
        }
      }

      // Progress ring: 0..1 berapa fraksi dari 800ms yang sudah berlalu.
      let progress = 0;
      if (hovered) {
        const remaining = Math.max(0, state.selectorPickStableUntil - now);
        progress = Math.min(1, 1 - remaining / 800);
      }
      updateSelectorProgress(hovered, progress);

      // Konfirmasi pemilihan: telunjuk stabil di box yang sama selama window.
      if (hovered && now >= state.selectorPickStableUntil) {
        enterActiveMode(hovered);
      }
    }

    function enterActiveMode(organKey) {
      state.appMode = 'ACTIVE';
      state.selectorHover = null;
      setSelectorVisible(false);
      spawnOrgan(organKey);
      // Reset transform organ ke spawn default
      state.pos.copy(SPAWN_POS);
      state.smoothPos.copy(SPAWN_POS);
      state.targetScale = SPAWN_SCALE;
      state.scale = SPAWN_SCALE;
      state.rotX = 0;
      state.rotY = 0;
      state.selectedPart = null;
      // Mulai loop suara organ yang sesuai (heart=lub-dub, lungs=breath).
      // Jika AudioContext belum di-start (user belum klik tombol), skip —
      // userKickAudio nanti akan men-trigger ulang sesuai state.activeOrgan.
      if (audio.started) startOrganAudioLoop(organKey);
      hintEl.textContent = `${ORGANS[organKey].icon} ${ORGANS[organKey].title} aktif • 👍 untuk kembali ke pilihan`;
    }

    function exitToSelector() {
      state.appMode = 'SELECTING';
      state.selectedPart = null;
      stopNarration();
      // Hentikan suara organ — selector mode hening.
      stopOrganAudioLoop();
      clearActiveOrgan();
      // Reset transform agar tidak ikut transform organ sebelumnya
      organContainer.position.set(0, 0, 0);
      organContainer.rotation.set(0, 0, 0);
      organContainer.scale.setScalar(1);
      // Bersihkan label
      labelSpriteMat.opacity = 0;
      leaderMat.opacity = 0;
      setSelectorVisible(true);
      setSelectorHover(null);
      hintEl.textContent = '👉 Tunjuk salah satu kotak untuk memilih organ';
    }

    function tickControls(now) {
      // Auto-kick audio saat pertama kali ada interaksi (tangan terdeteksi).
      // Browser butuh user gesture; menunjukkan tangan dianggap intent.
      if (!audio.started && latestHands.length > 0) {
        userKickAudio();
      }

      // ===== MODE: SELECTING =====
      if (state.appMode === 'SELECTING') {
        tickSelector(now);
        setMode('SELECT');
        return;
      }

      // ===== MODE: ACTIVE =====
      if (!organReady) return;

      // Thumbs up → kembali ke selector (edge-detect, sekali per gesture).
      const thumbsHand = latestHands.find(h => h.isThumbsUp);
      if (thumbsHand && !state.thumbsLatched) {
        state.thumbsLatched = true;
        exitToSelector();
        return;
      } else if (!thumbsHand) {
        state.thumbsLatched = false;
      }

      let mode = 'IDLE';
      state.highlight = 0;

      // ===== GRAB =====
      // Cari fist terdekat ke organ. Kalau dalam jangkauan → grab.
      let fistHand = null;
      let fistDist = Infinity;
      for (const h of latestHands) {
        if (!h.isFist) continue;
        const d = h.palmWorld.distanceTo(state.smoothPos);
        if (d < fistDist) { fistDist = d; fistHand = h; }
      }

      if (fistHand && fistDist < GRAB_DIST_WORLD * 2.0) {
        // Saat aktif grab, jangkauan diperbesar (sticky)
        if (state.grabActive || fistDist < GRAB_DIST_WORLD) {
          state.grabActive = true;
          state.grabReleaseUntil = now + RELEASE_DEBOUNCE_MS;
          const target = fistHand.palmWorld.clone();
          target.x = Math.max(-BOUND, Math.min(BOUND, target.x));
          target.y = Math.max(-BOUND, Math.min(BOUND, target.y));
          state.pos.copy(target);
          state.highlight = 1;
          mode = 'GRAB';
        }
      } else if (state.grabActive && now > state.grabReleaseUntil) {
        state.grabActive = false;
      }

      // ===== PINCH RESIZE =====
      // Butuh DUA tangan berbeda (Left & Right) yang sama-sama pointing.
      // Tanpa cek "label berbeda", MediaPipe kadang melaporkan dua deteksi
      // dari satu tangan yang sama (mis. tangan ter-detect ulang di area
      // wajah/leher) → ratio jarak mendadak kecil → zoom out spontan.
      const pointingHands = latestHands.filter(h => h.isPointing);
      const handLabels = new Set(pointingHands.map(h => h.label));
      const twoDistinctHands = pointingHands.length >= 2 && handLabels.size >= 2;
      if (twoDistinctHands) {
        // Ambil satu Left & satu Right (defensif kalau >2 deteksi)
        const left = pointingHands.find(h => h.label === 'Left');
        const right = pointingHands.find(h => h.label === 'Right');
        const a = left.indexTipWorld;
        const b = right.indexTipWorld;
        const d = a.distanceTo(b);
        // Jarak antar telunjuk realistis: jangan terima nilai ekstrim yang
        // sering jadi penanda false-positive (tangan palsu menempel di
        // tangan asli) — minimal 0.15 world units, maksimal 4.0.
        if (d >= 0.15 && d <= 4.0) {
          if (!state.pinchActive) {
            state.pinchBaseDist = d;
            state.pinchBaseScale = state.targetScale;
            state.pinchActive = true;
          } else {
            const ratio = d / state.pinchBaseDist;
            state.targetScale = Math.max(SCALE_MIN, Math.min(SCALE_MAX, state.pinchBaseScale * ratio));
          }
          state.highlight = 1;
          mode = mode === 'GRAB' ? 'GRAB+PINCH' : 'PINCH';
        } else {
          state.pinchActive = false;
        }
      } else {
        state.pinchActive = false;
      }

      // ===== TWO-FINGER ROTATE =====
      // Gesture: telunjuk + jari tengah extended dan rapat (lihat
      // isTwoFingerRotate). Drag tangan ini → delta x/y dari titik tengah
      // dua jari dikonversi ke rotasi Y/X jantung. Eksklusif dari pointing
      // (isPointing return false saat two-finger aktif), jadi tidak konflik.
      let rotateHand = null;
      if (!state.pinchActive && !state.grabActive) {
        for (const h of latestHands) {
          if (h.isTwoFingerRotate) { rotateHand = h; break; }
        }
      }
      if (rotateHand) {
        const cur = rotateHand.twoFingerCenterWorld;
        if (state.rotateLastPos && state.rotateActive) {
          const dx = cur.x - state.rotateLastPos.x;
          const dy = cur.y - state.rotateLastPos.y;
          state.rotY += dx * ROTATE_SENSITIVITY;
          state.rotX += -dy * ROTATE_SENSITIVITY;
          // clamp rotX agar tidak terbalik penuh
          state.rotX = Math.max(-1.4, Math.min(1.4, state.rotX));
        }
        state.rotateLastPos = { x: cur.x, y: cur.y };
        state.rotateActive = true;
        state.highlight = 1;
        mode = mode === 'IDLE' ? 'ROTATE' : (mode + '+ROT');
      } else {
        state.rotateActive = false;
        state.rotateLastPos = null;
      }

      // ===== PART PICKER =====
      // Satu telunjuk (tanpa pinch dua telunjuk, dan bukan two-finger rotate)
      // → cari part terdekat ke ujung telunjuk. Pakai jarak ke BOUNDING BOX
      // mesh dalam world space (lebih akurat dari bounding sphere — sphere
      // melebih-lebihkan part yang berbentuk pipih/half-dome seperti diafragma,
      // sehingga sphere-nya overlap ke lobus inferior di atasnya).
      let pickedPart = null;
      let pickIndexTipWorld = null;
      if (!state.pinchActive && !state.grabActive && !state.rotateActive) {
        const pointing = latestHands.find(h => h.isPointing);
        if (pointing) {
          pickIndexTipWorld = pointing.indexTipWorld;
          const meshes = getPickableMeshes();
          let bestDist = Infinity;
          let bestPart = null;
          // Helper: jarak titik ke AABB world-space. Kalau titik di dalam,
          // jarak = 0. Tie-break: pilih mesh dengan VOLUME bounding box lebih
          // kecil (= bagian lebih spesifik) supaya diafragma yang bbox-nya
          // overlap dengan lobus inferior tidak "mencuri" pick saat user
          // sebenarnya menunjuk lobus.
          //
          // Radius hit-test ADAPTIF: part tipis seperti trakea/bronkus (tube)
          // dapat threshold lebih longgar supaya bisa ditunjuk — tanpa ini,
          // bbox tube ~0.07 unit terlalu kecil, tip telunjuk yang sedikit
          // meleset langsung tidak mengenai.
          const _tmpBox = new THREE.Box3();
          const _tmpVec = new THREE.Vector3();
          const _tmpSize = new THREE.Vector3();
          let bestVolume = Infinity;
          for (const m of meshes) {
            // Hitung bounding box world-space (account for parent transforms).
            if (!m.geometry.boundingBox) m.geometry.computeBoundingBox();
            _tmpBox.copy(m.geometry.boundingBox).applyMatrix4(m.matrixWorld);
            _tmpBox.getSize(_tmpSize);
            const vol = _tmpSize.x * _tmpSize.y * _tmpSize.z;
            // Dimensi terkecil bbox menunjukkan "ketebalan" part. Untuk
            // part tipis (< 0.12 unit), tambahkan reach proporsional supaya
            // hit-test toleran terhadap tip yang melayang di tepi tube.
            const minDim = Math.min(_tmpSize.x, _tmpSize.y, _tmpSize.z);
            const radiusBonus = minDim < 0.12
              ? PICK_RADIUS_BONUS + (0.12 - minDim) * 0.8  // extra ~0.04-0.08
              : PICK_RADIUS_BONUS;

            // Clamp index tip ke kotak → titik terdekat di permukaan/dalam kotak.
            _tmpVec.copy(pickIndexTipWorld).clamp(_tmpBox.min, _tmpBox.max);
            const d = pickIndexTipWorld.distanceTo(_tmpVec);
            if (d >= radiusBonus) continue;

            // Prioritas: (1) jarak lebih kecil menang; (2) jarak hampir sama
            // (≤ 5cm world) → bbox lebih kecil (lebih spesifik) menang.
            const closer = d < bestDist - 0.05;
            const tieMoreSpecific = Math.abs(d - bestDist) <= 0.05 && vol < bestVolume;
            if (closer || tieMoreSpecific) {
              bestDist = d;
              bestVolume = vol;
              bestPart = m.userData.partId;
            }
          }
          if (bestPart) {
            pickedPart = bestPart;
            state.pickStableUntil = now + PICK_STICKY_MS;
          }
        }
      }

      // Sticky behavior: kalau telunjuk sempat hilang sebentar, tetap tampil.
      if (pickedPart) {
        if (state.selectedPart !== pickedPart) {
          state.selectedPart = pickedPart;
          drawLabel(pickedPart);
          setHighlight(pickedPart);
          // Trigger narasi (TTS) untuk part baru. speakPart sendiri yang
          // mengatur `lastSpokenPart` setelah narasi benar-benar dimulai
          // (di dalam timer callback) supaya kalau user hover-balik ke part
          // yang timer-nya keburu di-cancel, narasi masih bisa diputar.
          speakPart(pickedPart);
        }
        state.highlight = 1;
        mode = mode === 'IDLE' ? 'PICK' : (mode + '+PICK');
      } else if (state.selectedPart && now > state.pickStableUntil) {
        // Lepas seleksi setelah sticky window habis & tidak ada part baru.
        // Tapi pertahankan label saat user grab/pinch (visual context).
        if (!state.grabActive && !state.pinchActive) {
          state.selectedPart = null;
          setHighlight(null);
          stopNarration();
        }
      }

      setMode(mode);

      // Hint dinamis
      if (mode === 'IDLE') {
        if (latestHands.length === 0) {
          hintEl.textContent = '✋ Tunjukkan tangan ke kamera untuk berinteraksi';
        } else {
          hintEl.textContent = '👉 Tunjuk bagian • ✌️ rapat = rotasi • ✊ = pindah • 👉👉 = scale';
        }
      } else if (mode.startsWith('ROTATE')) {
        hintEl.textContent = '✌️ Geser dua jari rapat untuk memutar';
      } else if (mode.startsWith('PICK')) {
        const p = getParts()[state.selectedPart];
        hintEl.textContent = p ? `👉 ${p.title}` : '👉 Bagian terpilih';
      } else if (mode.startsWith('GRAB')) {
        hintEl.textContent = '✊ Genggam aktif — buka tangan untuk lepas';
      } else if (mode.startsWith('PINCH')) {
        hintEl.textContent = `🤏 Pinch resize — ${state.scale.toFixed(2)}x`;
      }
    }

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;

      // FPS
      fpsAccum += 1 / Math.max(dt, 1e-4);
      fpsCount++;
      if (fpsCount >= 20) {
        fpsEl.textContent = Math.round(fpsAccum / fpsCount);
        fpsAccum = 0; fpsCount = 0;
      }

      updateHud();
      tickControls(now);
      drawHandSkeleton();

      // ===== SELECTOR MODE: animasi box pilihan (float halus, billboard kamera)
      if (state.appMode === 'SELECTING') {
        const t = now * 0.001;
        for (let i = 0; i < selectorBoxes.length; i++) {
          const b = selectorBoxes[i];
          // Bob halus naik-turun, beda fase per box
          b.position.y = Math.sin(t * 1.5 + i * Math.PI) * 0.04;
          // Selalu menghadap kamera
          b.quaternion.copy(camera.quaternion);
        }
        // Skip semua organ transform & label saat SELECTING.
        labelSpriteMat.opacity += (0 - labelSpriteMat.opacity) * Math.min(1, 8 * dt);
        leaderMat.opacity += (0 - leaderMat.opacity) * Math.min(1, 8 * dt);
        renderer.render(scene, camera);
        return;
      }

      // Smoothing posisi
      state.smoothPos.lerp(state.pos, SMOOTHING);

      // Smoothing scale
      state.scale += (state.targetScale - state.scale) * Math.min(1, SCALE_LERP_SPEED * dt);

      // Apply ke organContainer
      organContainer.position.copy(state.smoothPos);

      // Pulse visual: delegasi ke organ module (pulse function). Heart →
      // beat lub-dub 70 BPM, lungs → breathing 0.25 Hz. Module bisa override
      // tanpa menyentuh file ini.
      let pulseScale = 1.0;
      if (state.animateBeat && state.activeOrgan) {
        const def = ORGANS[state.activeOrgan];
        if (def && typeof def.pulse === 'function') {
          pulseScale = def.pulse(now);
        }
      }
      organContainer.scale.setScalar(state.scale * pulseScale);

      // Rotasi: hanya dari user lewat gesture two-finger (state.rotX/rotY).
      // Tidak ada auto-rotate.
      organContainer.rotation.set(state.rotX, state.rotY, 0);

      // Label sprite: posisi & visibilitas
      if (state.selectedPart && activeOrganMesh) {
        // Cari mesh pertama yang cocok dengan partId untuk anchor posisi.
        let anchorWorld = null;
        activeOrganMesh.traverse((o) => {
          if (anchorWorld) return;
          if (o.isMesh && o.userData.partId === state.selectedPart) {
            if (!o.geometry.boundingSphere) o.geometry.computeBoundingSphere();
            const c = o.geometry.boundingSphere.center.clone();
            o.localToWorld(c);
            anchorWorld = c;
          }
        });
        if (anchorWorld) {
          // Adaptive placement: coba 4 kandidat posisi (kanan-atas, kiri-atas,
          // kanan-bawah, kiri-bawah) relatif kamera, lalu pilih yang seluruh
          // bounding box label-nya muat di viewport NDC dengan margin. Kalau
          // tak ada yang muat sempurna → clamp posisi center label.
          const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
          const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);

          const sprW = labelSprite.scale.x; // world units (full width)
          const sprH = labelSprite.scale.y;
          const offX = 0.55 + sprW * 0.5;   // jarak dari anchor ke center label
          const offY = 0.25 + sprH * 0.5;
          const candidates = [
            { sx: +1, sy: +1 }, // kanan-atas
            { sx: -1, sy: +1 }, // kiri-atas
            { sx: +1, sy: -1 }, // kanan-bawah
            { sx: -1, sy: -1 }, // kiri-bawah
          ];

          // Helper: proyeksi titik world → NDC (x,y di [-1,1] jika dalam frustum).
          const projectNDC = (v) => {
            const p = v.clone().project(camera);
            return { x: p.x, y: p.y, z: p.z };
          };

          const MARGIN = 0.06; // margin viewport NDC (≈ 3% layar)
          let chosen = null;
          let chosenCenter = null;
          let chosenScore = -Infinity;

          for (const cand of candidates) {
            const center = anchorWorld.clone()
              .add(camRight.clone().multiplyScalar(cand.sx * offX))
              .add(camUp.clone().multiplyScalar(cand.sy * offY));

            // Sampel 4 sudut bbox label untuk dicek di NDC.
            const corners = [
              center.clone().add(camRight.clone().multiplyScalar(-sprW * 0.5)).add(camUp.clone().multiplyScalar(-sprH * 0.5)),
              center.clone().add(camRight.clone().multiplyScalar(+sprW * 0.5)).add(camUp.clone().multiplyScalar(-sprH * 0.5)),
              center.clone().add(camRight.clone().multiplyScalar(-sprW * 0.5)).add(camUp.clone().multiplyScalar(+sprH * 0.5)),
              center.clone().add(camRight.clone().multiplyScalar(+sprW * 0.5)).add(camUp.clone().multiplyScalar(+sprH * 0.5)),
            ];
            let fits = true;
            let worstMargin = Infinity;
            for (const cr of corners) {
              const n = projectNDC(cr);
              const mLeft = n.x - (-1 + MARGIN);
              const mRight = (1 - MARGIN) - n.x;
              const mBot = n.y - (-1 + MARGIN);
              const mTop = (1 - MARGIN) - n.y;
              const minM = Math.min(mLeft, mRight, mBot, mTop);
              if (minM < 0) fits = false;
              if (minM < worstMargin) worstMargin = minM;
            }
            // Score: kandidat yang fit menang; di antara yang fit, ambil yang
            // pertama (priority order). Kalau tidak ada yang fit, ambil yang
            // worstMargin paling besar (paling sedikit keluar).
            if (fits) {
              chosen = cand;
              chosenCenter = center;
              break;
            }
            if (worstMargin > chosenScore) {
              chosenScore = worstMargin;
              chosen = cand;
              chosenCenter = center;
            }
          }

          // Clamp final: kalau center masih keluar viewport, geser ke dalam
          // dengan menambah delta sepanjang sumbu kamera (bukan world).
          const cNdc = projectNDC(chosenCenter);
          const halfNdcW = (sprW * 0.5) / Math.abs(chosenCenter.clone().sub(camera.position).length() * Math.tan(camera.fov * 0.5 * Math.PI / 180) * camera.aspect);
          const halfNdcH = (sprH * 0.5) / Math.abs(chosenCenter.clone().sub(camera.position).length() * Math.tan(camera.fov * 0.5 * Math.PI / 180));
          const maxX = 1 - MARGIN - halfNdcW;
          const maxY = 1 - MARGIN - halfNdcH;
          const minX = -1 + MARGIN + halfNdcW;
          const minY = -1 + MARGIN + halfNdcH;

          let shiftX = 0, shiftY = 0;
          if (cNdc.x > maxX) shiftX = cNdc.x - maxX;
          else if (cNdc.x < minX) shiftX = cNdc.x - minX;
          if (cNdc.y > maxY) shiftY = cNdc.y - maxY;
          else if (cNdc.y < minY) shiftY = cNdc.y - minY;

          if (shiftX !== 0 || shiftY !== 0) {
            // Konversi shift NDC ke world units pada kedalaman center.
            const dist = chosenCenter.clone().sub(camera.position).length();
            const worldPerNdcY = Math.tan(camera.fov * 0.5 * Math.PI / 180) * dist;
            const worldPerNdcX = worldPerNdcY * camera.aspect;
            chosenCenter
              .add(camRight.clone().multiplyScalar(-shiftX * worldPerNdcX))
              .add(camUp.clone().multiplyScalar(-shiftY * worldPerNdcY));
          }

          labelSprite.position.copy(chosenCenter);

          // Leader line: dari anchor → corner label terdekat ke anchor
          // (sisi yang menghadap part). Pakai chosen.sx/sy untuk memilih sudut.
          const cornerOffset = camRight.clone().multiplyScalar(-chosen.sx * sprW * 0.5)
            .add(camUp.clone().multiplyScalar(-chosen.sy * sprH * 0.5));
          const leaderEnd = chosenCenter.clone().add(cornerOffset);

          const positions = leaderGeo.attributes.position.array;
          positions[0] = anchorWorld.x;
          positions[1] = anchorWorld.y;
          positions[2] = anchorWorld.z;
          positions[3] = leaderEnd.x;
          positions[4] = leaderEnd.y;
          positions[5] = leaderEnd.z;
          leaderGeo.attributes.position.needsUpdate = true;

          labelSpriteMat.opacity += (1 - labelSpriteMat.opacity) * Math.min(1, 8 * dt);
          leaderMat.opacity += (0.6 - leaderMat.opacity) * Math.min(1, 8 * dt);
        }
      } else {
        labelSpriteMat.opacity += (0 - labelSpriteMat.opacity) * Math.min(1, 8 * dt);
        leaderMat.opacity += (0 - leaderMat.opacity) * Math.min(1, 8 * dt);
      }

      renderer.render(scene, camera);
    }

    // ---------------------------------------------------------------------
    // [8] BOOT
    // ---------------------------------------------------------------------
    async function startMediaPipe() {
      if (typeof Hands === 'undefined' || typeof Camera === 'undefined') {
        throw new Error('Library MediaPipe gagal dimuat. Periksa koneksi internet.');
      }
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`,
      });
      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 0,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.5,
      });
      hands.onResults(onResults);

      const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
      const cam = new Camera(videoEl, {
        onFrame: async () => { await hands.send({ image: videoEl }); },
        width: isMobile ? 480 : 640,
        height: isMobile ? 360 : 480,
        facingMode: 'user',
      });
      await cam.start();
    }

    (async function boot() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('Browser tidak mendukung akses kamera (getUserMedia).');
        }

        loaderText.innerHTML = 'Meminta akses kamera...';
        await startMediaPipe();
        // Mulai dari SELECTING mode — selector boxes tampil, organ belum spawn.
        setSelectorVisible(true);
        setSelectorHover(null);
        loaderText.innerHTML = 'Siap! 👉 Tunjuk kotak untuk pilih organ.';
        setTimeout(() => loaderEl.classList.add('hidden'), 500);
        requestAnimationFrame(animate);
      } catch (err) {
        console.error(err);
        errorMsg.textContent = err.message || 'Terjadi kesalahan tak terduga.';
        errorEl.classList.add('show');
        loaderEl.classList.add('hidden');
      }
    })();
  </script>
</body>
