<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>WebAR Hand Tracking | Clap & Grab</title>
  <link rel="stylesheet" href="css/ar-common.css">
  <style>
    /* ---------- Page-specific: camera & canvas stack ---------- */
    #container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: var(--z-camera);
    }

    #three-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: var(--z-three);
      pointer-events: none;
    }

    /* ---------- Page-specific: white flash effect ---------- */
    #flash {
      position: absolute;
      inset: 0;
      z-index: var(--z-fx);
      background: #fff;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="container">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="three-canvas"></canvas>
    <div id="flash"></div>

    <div id="hud">
      <div class="badge">
        <div>State: <b id="state-label">IDLE</b></div>
        <div>Net: <span id="net-label" class="warn">cross</span></div>
        <div>Hands: <span id="hands-count" class="muted">0</span></div>
        <div>L: <span id="gesture-l" class="muted">—</span></div>
        <div>R: <span id="gesture-r" class="muted">—</span></div>
        <div>FPS: <span id="fps" class="muted">0</span></div>
      </div>
      <a href="index.html" id="back-btn">← Kembali</a>
    </div>

    <div id="hint">👏 Tepuk tangan untuk memunculkan kubus</div>

    <div id="loader">
      <div class="spinner"></div>
      <p id="loader-text">Memuat model hand tracking...<br>Izinkan akses kamera saat diminta.</p>
    </div>

    <div id="error">
      <div class="box">
        <h3>Tidak dapat memulai AR</h3>
        <p id="error-msg">Pastikan browser memiliki izin kamera dan koneksi internet aktif.</p>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"
    crossorigin="anonymous"></script>

  <script type="module">
    /* =====================================================================
     * WebAR Hand Tracking — Clap & Grab
     * ---------------------------------------------------------------------
     * Alur tingkat tinggi:
     *   1. MediaPipe Hands membaca frame dari <video> (kamera depan) dan
     *      menghasilkan landmark 21 titik per tangan setiap frame.
     *   2. onResults() menyaring landmark itu menjadi struktur `latestHands`
     *      yang berisi gesture flags (fist/open/thumbsUp/pointing) +
     *      koordinat dunia 3D dari telapak & ujung telunjuk.
     *   3. Setiap frame requestAnimationFrame, animate() memanggil
     *      tickStateMachine() untuk berpindah antar state berdasarkan
     *      gesture, lalu meng-update Three.js scene (posisi, skala, fade,
     *      derajat unfold jaring-jaring kubus).
     *
     * State machine: IDLE → SPAWNED → GRABBED → UNFOLDED
     *   IDLE      : tidak ada kubus. Tepuk tangan (clap) → SPAWNED.
     *   SPAWNED   : kubus muncul, auto-rotate. Genggam (fist) dekat kubus
     *               → GRABBED. Clap lagi atau thumbs-up → IDLE.
     *   GRABBED   : kubus mengikuti telapak. Lepas (tangan menjauh) →
     *               kembali ke state asal. Dua fist + spread → UNFOLDED.
     *   UNFOLDED  : kubus terbuka jadi jaring-jaring. Telunjuk menyentuh →
     *               rotasi. Thumbs-up → cycle pola jaring berikutnya.
     *               Fist+pointing spread → fold balik. Clap → IDLE.
     *
     * Pinch resize (dua telunjuk) aktif pada SPAWNED & UNFOLDED.
     * ===================================================================== */

    import * as THREE from 'three';
    import { Line2 } from 'three/addons/lines/Line2.js';
    import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
    import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';

    // ---------------------------------------------------------------------
    // [1] DOM REFS — elemen yang dimanipulasi langsung (HUD, loader, dll)
    // ---------------------------------------------------------------------
    const videoEl = document.getElementById('video');
    const canvasEl = document.getElementById('three-canvas');
    const stateLabel = document.getElementById('state-label');
    const netLabel = document.getElementById('net-label');
    const handsCountEl = document.getElementById('hands-count');
    const gestureLEl = document.getElementById('gesture-l');
    const gestureREl = document.getElementById('gesture-r');
    const fpsEl = document.getElementById('fps');
    const hintEl = document.getElementById('hint');
    const flashEl = document.getElementById('flash');
    const loaderEl = document.getElementById('loader');
    const loaderText = document.getElementById('loader-text');
    const errorEl = document.getElementById('error');
    const errorMsg = document.getElementById('error-msg');

    // ---------------------------------------------------------------------
    // [2] THREE.JS SETUP — scene, kamera perspektif, renderer transparan
    // di atas <video>. alpha:true agar feed kamera tetap terlihat di belakang.
    // ---------------------------------------------------------------------
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 2);

    const renderer = new THREE.WebGLRenderer({
      canvas: canvasEl,
      alpha: true,
      antialias: window.devicePixelRatio < 2,
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.setClearColor(0x000000, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
    dirLight.position.set(1, 2, 3);
    scene.add(dirLight);

    // ---------------------------------------------------------------------
    // [3] CUBE GROUP & MATERIALS
    // cubeGroup = container untuk 6 face. Kita render setiap face sebagai
    // plane terpisah agar bisa di-"unfold" (interpolasi antara posisi folded
    // dan posisi pada bidang datar) dengan mudah.
    // ---------------------------------------------------------------------
    const cubeGroup = new THREE.Group();
    cubeGroup.visible = false;
    scene.add(cubeGroup);

    const CUBE_SIZE = 0.32;
    const NEON_COLOR = 0x00ffe7;
    const NEON_GRAB = 0x39ff14;
    const NEON_HIGHLIGHT = 0xff2bd6;
    const NEON_GLOW = 0x00ffff;

    const fillMat = new THREE.MeshBasicMaterial({
      color: NEON_COLOR,
      transparent: true,
      opacity: 0.18,
      depthWrite: false,
      side: THREE.DoubleSide,
    });
    const wireMat = new LineMaterial({
      color: NEON_COLOR,
      linewidth: 6,
      transparent: true,
      opacity: 1.0,
      depthTest: true,
      worldUnits: false,
    });
    wireMat.resolution.set(window.innerWidth, window.innerHeight);
    const haloMat = new LineMaterial({
      color: NEON_GLOW,
      linewidth: 14,
      transparent: true,
      opacity: 0.35,
      depthTest: true,
      blending: THREE.AdditiveBlending,
      worldUnits: false,
    });
    haloMat.resolution.set(window.innerWidth, window.innerHeight);

    const faceGeo = new THREE.PlaneGeometry(CUBE_SIZE, CUBE_SIZE);
    const HALF = CUBE_SIZE / 2;
    const faceEdges = new THREE.EdgesGeometry(faceGeo);
    const faceLineSegGeo = new LineSegmentsGeometry().fromEdgesGeometry(faceEdges);

    // Buat texture kanvas berisi angka (1..6) untuk label face.
    // Hasilnya berupa Mesh plane kecil yang ditempel di tengah face.
    function makeNumberSprite(n) {
      const size = 256;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, size, size);
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#00ffe7';
      ctx.lineWidth = 8;
      ctx.font = 'bold 180px "Segoe UI", Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#00ffe7';
      ctx.shadowBlur = 24;
      ctx.fillText(String(n), size / 2, size / 2 + 6);
      ctx.shadowBlur = 0;
      ctx.strokeText(String(n), size / 2, size / 2 + 6);
      const tex = new THREE.CanvasTexture(c);
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      const mat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
      });
      const labelSize = CUBE_SIZE * 0.7;
      const labelGeo = new THREE.PlaneGeometry(labelSize, labelSize);
      return new THREE.Mesh(labelGeo, mat);
    }

    function buildFace(number) {
      const g = new THREE.Group();
      const fill = new THREE.Mesh(faceGeo, fillMat);
      fill.position.y = HALF;
      g.add(fill);
      const wire = new Line2(faceLineSegGeo, wireMat);
      wire.computeLineDistances();
      wire.position.y = HALF;
      g.add(wire);
      const halo = new Line2(faceLineSegGeo, haloMat);
      halo.computeLineDistances();
      halo.position.y = HALF;
      g.add(halo);
      if (number !== undefined) {
        const label = makeNumberSprite(number);
        label.position.set(0, HALF, 0.001);
        g.add(label);
        // Sisi belakang label (untuk side face yang di-rotate Y=90°, normal ada di -X juga)
        const labelBack = makeNumberSprite(number);
        labelBack.position.set(0, HALF, -0.001);
        labelBack.rotation.y = Math.PI;
        g.add(labelBack);
      }
      return g;
    }

    // ===== Flat hierarchy: setiap face = child langsung cubeGroup =====
    // Plane default di XY (lebar di X, tinggi di Y, normal +Z).
    // Posisi face = pusat plane (bukan tepi/hinge).
    // Setiap net mendefinisikan { pos, rot } per face untuk state unfolded;
    // state folded sama untuk semua net (bentuk kubus utuh).

    function makeFace(number) {
      const g = new THREE.Group();
      const fill = new THREE.Mesh(faceGeo, fillMat);
      g.add(fill);
      const wire = new Line2(faceLineSegGeo, wireMat); wire.computeLineDistances(); g.add(wire);
      const halo = new Line2(faceLineSegGeo, haloMat); halo.computeLineDistances(); g.add(halo);
      if (number !== undefined) {
        const label = makeNumberSprite(number);
        label.position.set(0, 0, 0.002);
        g.add(label);
        // const labelBack = makeNumberSprite(number);
        // labelBack.position.set(0, 0, -0.002);
        // labelBack.rotation.y = Math.PI;
        // g.add(labelBack);
      }
      return g;
    }

    // 6 face dengan label angka sesuai dadu (top=1, bottom=6, dst).
    // Disimpan di map agar bisa di-akses berdasarkan nama face.
    const faceMeshes = {
      bottom: makeFace(6),
      top: makeFace(1),
      front: makeFace(2),
      back: makeFace(5),
      right: makeFace(3),
      left: makeFace(4),
    };
    for (const k in faceMeshes) cubeGroup.add(faceMeshes[k]);

    const PI2 = Math.PI / 2;

    // Folded transforms (bentuk kubus). Sama untuk semua net.
    // Plane default normal +Z. Tiap face dirotasi agar normal-nya menghadap ke luar.
    const FOLDED = {
      bottom: { pos: [0, -HALF, 0], rot: [+PI2, 0, 0] },  // normal -Y
      top: { pos: [0, +HALF, 0], rot: [-PI2, 0, 0] },  // normal +Y
      front: { pos: [0, 0, +HALF], rot: [0, 0, 0] },  // normal +Z
      back: { pos: [0, 0, -HALF], rot: [0, Math.PI, 0] }, // normal -Z
      right: { pos: [+HALF, 0, 0], rot: [0, +PI2, 0] },  // normal +X
      left: { pos: [-HALF, 0, 0], rot: [0, -PI2, 0] },  // normal -X
    };

    // Helper: posisi unfolded di lantai y=-HALF, plane normal +Y (rot X = -PI/2),
    // grid coord (gx, gz) menggeser di sumbu X dan Z dengan satuan CUBE_SIZE.
    // rotZ tambahan opsional untuk menjaga orientasi label tetap upright.
    function flat(gx, gz, rotZ = 0) {
      return { pos: [gx * CUBE_SIZE, -HALF, gz * CUBE_SIZE], rot: [-PI2, 0, rotZ] };
    }

    // 3 NET: cross (T-shape), plus (Latin cross), strip (1-4-1).
    // Layout dilihat dari atas (top-down view, +X kanan, +Z ke depan).
    //
    // CROSS:           PLUS:            STRIP:
    //     [1]              [1]              [1]
    // [4][6][3][5]      [4][6][3]      [6][3][5][4]
    //     [2]              [5]              [2]
    //                      [2]
    // Tata letak (top-down view): center = bottom face. Grid coord (gx, gz).
    // CROSS (T):           PLUS (Latin cross):       STRIP (1-4-1):
    //       [1] z=-2             [1] z=-1               [1]  z=-1
    //       [5] z=-1         [4][6][3]                  [6][3][5][4] ← row z=0
    //   [4][6][3] z=0            [5] z=+1               [2]  z=+1
    //       [2] z=+1             [2] z=+2
    // 11 net hexomino valid kubus. Format: 4 face dalam satu baris (column gx ∈ [0..3] di z=0)
    // adalah "spine"; face top/front menempel ke salah satu cell spine via z=±1.
    // Konvensi grid: bottom selalu di (0,0). Spine berisi: bottom(0), right(1), back(2), left(3).
    // top/front ditempatkan di z=-1 atau z=+1 pada salah satu kolom spine (atau membentuk variasi 2-3-1, 2-2-2, 3-3).
    const NETS = [
      // ===== 1-4-1 family (6 net): spine 4 face di z=0; top & front di z=-1 dan z=+1 =====
      {
        name: '1-4-1 a',
        bottom: flat(0, 0), right: flat(1, 0), back: flat(2, 0), left: flat(3, 0),
        top:    flat(0, -1), front: flat(0, 1),
      },
      {
        name: '1-4-1 b',
        bottom: flat(0, 0), right: flat(1, 0), back: flat(2, 0), left: flat(3, 0),
        top:    flat(0, -1), front: flat(1, 1),
      },
      {
        name: '1-4-1 c',
        bottom: flat(0, 0), right: flat(1, 0), back: flat(2, 0), left: flat(3, 0),
        top:    flat(0, -1), front: flat(2, 1),
      },
      {
        name: '1-4-1 d',
        bottom: flat(0, 0), right: flat(1, 0), back: flat(2, 0), left: flat(3, 0),
        top:    flat(1, -1), front: flat(2, 1),
      },
      {
        name: 'cross',
        bottom: flat(0, 0), right: flat(1, 0), back: flat(2, 0), left: flat(3, 0),
        top:    flat(1, -1), front: flat(1, 1),
      },
      {
        name: '1-4-1 f',
        bottom: flat(0, 0), right: flat(1, 0), back: flat(2, 0), left: flat(3, 0),
        top:    flat(2, -1), front: flat(1, 1),
      },
      // ===== 2-3-1 family (3 net): spine 3 face di z=0 (kolom 0..2), 1 face menonjol di z=-1 atau z=+1, dan 2 face menempel sebagai pasangan =====
      {
        name: '2-3-1 a',
        bottom: flat(0, 0), right: flat(1, 0), back: flat(2, 0),
        front:  flat(2, 1), left:  flat(3, 1), top: flat(0, -1),
      },
      {
        name: '2-3-1 b',
        bottom: flat(0, 0), right: flat(1, 0), back: flat(2, 0),
        front:  flat(2, 1), left:  flat(3, 1), top: flat(1, -1),
      },
      {
        name: '2-3-1 c',
        bottom: flat(0, 0), right: flat(1, 0), back: flat(2, 0),
        front:  flat(2, 1), left:  flat(3, 1), top: flat(2, -1),
      },
      // ===== 2-2-2 family (1 net): zigzag/staircase =====
      {
        name: 'zigzag',
        top:    flat(0, -1), bottom: flat(0, 0),
        right:  flat(1, 0),  back:  flat(1, 1),
        left:   flat(2, 1),  front: flat(2, 2),
      },
      // ===== 3-3 family (1 net): dua baris 3 face, offset =====
      {
        name: '3-3',
        bottom: flat(0, 0), right: flat(1, 0), back: flat(2, 0),
        top:    flat(1, 1), left:  flat(2, 1), front: flat(3, 1),
      },
    ];
    let currentNetIdx = 0;

    // Kumpulan Quaternion+Vector3 helpers untuk lerp transform
    const _qFold = new THREE.Quaternion();
    const _qUnfold = new THREE.Quaternion();
    const _qOut = new THREE.Quaternion();
    const _eFold = new THREE.Euler();
    const _eUnfold = new THREE.Euler();
    const _vFold = new THREE.Vector3();
    const _vUnfold = new THREE.Vector3();

    // Interpolasi tiap face antara FOLDED (kubus utuh) dan NETS[currentNetIdx]
    // (jaring-jaring datar). t=0 → kubus, t=1 → flat. Pakai SLERP untuk rotasi
    // agar transisi tidak gimbal-flip dan LERP linear untuk posisi.
    function setUnfold(t) {
      const a = THREE.MathUtils.clamp(t, 0, 1);
      const net = NETS[currentNetIdx];
      for (const key of Object.keys(faceMeshes)) {
        const mesh = faceMeshes[key];
        const f = FOLDED[key];
        const u = net[key];
        _vFold.fromArray(f.pos);
        _vUnfold.fromArray(u.pos);
        mesh.position.lerpVectors(_vFold, _vUnfold, a);
        _eFold.set(f.rot[0], f.rot[1], f.rot[2]);
        _eUnfold.set(u.rot[0], u.rot[1], u.rot[2]);
        _qFold.setFromEuler(_eFold);
        _qUnfold.setFromEuler(_eUnfold);
        _qOut.slerpQuaternions(_qFold, _qUnfold, a);
        mesh.quaternion.copy(_qOut);
      }
    }
    setUnfold(0);

    const glowMat = { opacity: 0, color: new THREE.Color(NEON_GLOW) };

    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
      wireMat.resolution.set(w, h);
      haloMat.resolution.set(w, h);
    }
    window.addEventListener('resize', onResize);
    onResize();

    // ---------------------------------------------------------------------
    // [4] GESTURE DETECTION HELPERS
    // Semua bekerja pada landmark MediaPipe (lm[0..20]) dalam koordinat
    // ternormalisasi 0..1 (x,y) + z relatif. Indeks penting:
    //   0  = wrist
    //   4  = thumb tip,  3 = thumb IP
    //   8  = index tip,  5 = index MCP
    //   12 = middle tip, 9  = middle MCP
    //   16 = ring tip,   13 = ring MCP
    //   20 = pinky tip,  17 = pinky MCP
    // ---------------------------------------------------------------------
    function dist(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const dz = (a.z || 0) - (b.z || 0);
      return Math.sqrt(dx * dx + dy * dy + dz * dz);
    }

    function palmCenter(lm) {
      const idxs = [0, 5, 9, 13, 17];
      let x = 0, y = 0, z = 0;
      for (const i of idxs) {
        x += lm[i].x; y += lm[i].y; z += lm[i].z || 0;
      }
      return { x: x / idxs.length, y: y / idxs.length, z: z / idxs.length };
    }

    function palmSize(lm) {
      return dist(lm[0], lm[9]);
    }

    function isClosedFist(lm) {
      // not thumbs up, tapi genggaman biasa: semua jari (kecuali ibu jari) terlipat dekat telapak
      if (isThumbsUp(lm) || isPointing(lm)) return false;

      const wrist = lm[0];
      const tips = [8, 12, 16, 20];
      const mcps = [5, 9, 13, 17];
      let folded = 0;
      for (let i = 0; i < tips.length; i++) {
        const dTip = dist(lm[tips[i]], wrist);
        const dMcp = dist(lm[mcps[i]], wrist);
        if (dTip < dMcp * 1.05) folded++;
      }
      return folded >= 3;
    }

    function isOpenHand(lm) {
      const palm = palmCenter(lm);
      const tips = [8, 12, 16, 20];
      const ps = palmSize(lm);
      let extended = 0;
      for (const t of tips) {
        if (dist(lm[t], palm) > ps * 1.3) extended++;
      }
      return extended >= 3;
    }

    function isThumbsUp(lm) {
      if (isPointing(lm)) return false; // jangan sampai salah deteksi pointing sebagai thumbs up
      const wrist = lm[0];
      const thumbTip = lm[4];
      const thumbIP = lm[3]; // sendi sebelum ujung ibu jari

      const tips = [8, 12, 16, 20]; // jari lain
      const mcps = [5, 9, 13, 17];

      // 1. Cek jari lain terlipat (seperti fist)
      let folded = 0;
      for (let i = 0; i < tips.length; i++) {
        const dTip = dist(lm[tips[i]], wrist);
        const dMcp = dist(lm[mcps[i]], wrist);
        if (dTip < dMcp * 1.05) folded++;
      }

      // minimal 3 jari terlipat
      const fingersFolded = folded >= 4;

      // 2. Cek ibu jari terbuka (menjauh dari telapak)
      const palm = palmCenter(lm);
      const ps = palmSize(lm);
      const thumbExtended = dist(thumbTip, palm) > ps * 1.2;

      // 3. Cek arah ibu jari ke atas
      // (ingat: koordinat y makin kecil = makin ke atas)
      const thumbUp = thumbTip.y < thumbIP.y;

      return fingersFolded && thumbExtended && thumbUp;
    }

    function isPointing(lm) {
      const wrist = lm[0];

      // index finger (telunjuk)
      const indexTip = lm[8];
      const indexMcp = lm[5];

      // jari lain
      const otherTips = [12, 16, 20];
      const otherMcps = [9, 13, 17];

      // 1. cek telunjuk terbuka
      const dIndexTip = dist(indexTip, wrist);
      const dIndexMcp = dist(indexMcp, wrist);
      const indexExtended = dIndexTip > dIndexMcp * 1.2;

      // 2. cek jari lain terlipat
      let folded = 0;
      for (let i = 0; i < otherTips.length; i++) {
        const dTip = dist(lm[otherTips[i]], wrist);
        const dMcp = dist(lm[otherMcps[i]], wrist);
        if (dTip < dMcp * 1.05) folded++;
      }

      const othersFolded = folded >= 2;

      return indexExtended && othersFolded;
    }
    // Konversi titik landmark (NDC 0..1, dengan x mirror karena video
    // di-flip horizontally via CSS) → posisi dunia 3D pada kedalaman tetap.
    // Dipakai untuk menempatkan kubus & menghitung jarak fist→kubus.
    function landmarkToWorld(p, depth = 1.5) {
      const ndcX = -((p.x * 2) - 1);
      const ndcY = -((p.y * 2) - 1);
      const v = new THREE.Vector3(ndcX, ndcY, 0.5);
      v.unproject(camera);
      const dir = v.sub(camera.position).normalize();
      return camera.position.clone().add(dir.multiplyScalar(depth));
    }

    // ---------------------------------------------------------------------
    // [5] STATE MACHINE
    // `sm` = state model. Selain state utama, ia juga menampung counter
    // gesture (clapFramesClose, spreadOpenFrames), debounce timestamp, dan
    // target value yang akan di-lerp di animate() (targetScale, targetFade,
    // targetUnfold). Pola counter+threshold dipakai supaya gesture harus
    // konsisten beberapa frame baru memicu, mengurangi false positive.
    // ---------------------------------------------------------------------
    const STATES = { IDLE: 'IDLE', SPAWNED: 'SPAWNED', GRABBED: 'GRABBED', UNFOLDED: 'UNFOLDED' };
    const sm = {
      state: STATES.IDLE,
      pos: new THREE.Vector3(0, 0, 0),
      smoothPos: new THREE.Vector3(0, 0, 0),
      hasSmooth: false,
      scale: 0.001,
      targetScale: 0.001,
      fade: 0,
      targetFade: 0,
      clapFramesClose: 0,
      clapHoldUntil: 0,
      clapDebounceUntil: 0,
      lastClapPos: null,
      grabHandIdx: -1,
      grabFromState: null,
      grabReleaseDebounceUntil: 0,
      unfold: 0,
      targetUnfold: 0,
      spreadOpenFrames: 0,
      rotateLastIndex: null,
      rotateActive: false,
      swipeStartX: null,
      swipeStartTime: 0,
      swipeDebounceUntil: 0,
      thumbsLatched: false,
      pinchBaseDist: 0,
      pinchBaseScale: 1,
      pinchActive: false,
      highlight: 0,
    };

    // Konstanta tuning gesture. Satuan:
    //   *_NORM  → koordinat MediaPipe ternormalisasi (0..1)
    //   *_WORLD → satuan three.js setelah landmarkToWorld()
    //   *_MS    → milidetik (debounce)
    //   *_FRAMES→ jumlah frame berturut-turut sebelum gesture dianggap valid
    const CLAP_DIST_NORM = 0.12;
    const CLAP_FRAMES = 3;
    const CLAP_DEBOUNCE_MS = 1500;
    const GRAB_DIST_WORLD = 0.45;
    const RELEASE_DEBOUNCE_MS = 200;
    const SPREAD_DIST_NORM = 0.55;
    const SPREAD_FRAMES = 8;
    const UNFOLD_SPEED = 2.5;
    const ROTATE_TOUCH_DIST = 0.6;
    const ROTATE_SENSITIVITY = 2.5;
    const PINCH_SCALE_MIN = 0.3;
    const PINCH_SCALE_MAX = 3.0;
    const SWIPE_MIN_DX = 0.7;            // jarak minimum (world units) untuk dianggap swipe
    const SWIPE_MAX_DURATION_MS = 600;   // batas waktu swipe
    const SWIPE_DEBOUNCE_MS = 1200;
    const SMOOTHING = 0.35;
    const FADE_IN_SPEED = 6.0;
    const FADE_OUT_SPEED = 4.0;
    const SCALE_SPEED = 8.0;
    const BOUND = 1.6;

    function setState(next, hint) {
      if (sm.state !== next) {
        sm.state = next;
        stateLabel.textContent = next;
      }
      if (hint !== undefined) {
        hintEl.textContent = hint;
        hintEl.style.opacity = '1';
      }
    }

    function flash() {
      flashEl.style.transition = 'none';
      flashEl.style.opacity = '0.6';
      requestAnimationFrame(() => {
        flashEl.style.transition = 'opacity 0.4s';
        flashEl.style.opacity = '0';
      });
    }

    // ---------------------------------------------------------------------
    // [6] MEDIAPIPE RESULTS
    // Callback yang dipanggil MediaPipe Hands setiap kali ia selesai
    // memproses 1 frame. Kita normalkan output menjadi array `latestHands`
    // berisi pre-computed flags & posisi dunia agar tickStateMachine()
    // tidak perlu menghitung ulang setiap state-block.
    // ---------------------------------------------------------------------
    let latestHands = []; // [{lm, label, palmCenter, palmWorld, isFist, isOpen}]

    function onResults(results) {
      const hands = [];
      if (results.multiHandLandmarks && results.multiHandedness) {
        for (let i = 0; i < results.multiHandLandmarks.length; i++) {
          const lm = results.multiHandLandmarks[i];
          // multiHandedness label adalah dari sudut pandang gambar; karena kita mirror
          // tampilan, "Left"/"Right" akan terbalik bagi user — tidak masalah untuk logika kita.
          const label = results.multiHandedness[i].label;
          const palm = palmCenter(lm);
          hands.push({
            lm,
            label,
            palm,
            palmWorld: landmarkToWorld(palm),
            indexTipWorld: landmarkToWorld(lm[8]),
            isFist: isClosedFist(lm),
            isOpen: isOpenHand(lm),
            isThumbsUp: isThumbsUp(lm),
            isPointing: isPointing(lm),
          });
        }
      }
      latestHands = hands;
    }

    // ---------------------------------------------------------------------
    // [7] UPDATE LOOP — dipanggil per-frame via requestAnimationFrame.
    // Urutan kerja tiap frame:
    //   updateHud()         → refresh badge gesture & FPS
    //   tickStateMachine()  → transisi state berdasar latestHands
    //   smoothPos.lerp      → pelan-pelan kejar sm.pos (anti-jitter)
    //   fade/scale/unfold   → lerp menuju target
    //   apply ke cubeGroup  → posisi/skala/rotasi/warna material
    //   renderer.render     → gambar
    // ---------------------------------------------------------------------
    let lastFrame = performance.now();
    let fpsAccum = 0, fpsCount = 0;

    function updateHud() {
      handsCountEl.textContent = String(latestHands.length);
      handsCountEl.className = latestHands.length > 0 ? 'ok' : 'muted';

      const fmt = (h) => {
        if (!h) return ['—', 'muted'];
        if (h.isFist) return ['Menggenggam ✊', 'hot'];
        if (h.isOpen) return ['Terbuka ✋', 'ok'];
        if (h.isThumbsUp) return ['Jempol ke Atas 👍', 'ok'];
        if (h.isPointing) return ['Menunjuk 👉', 'ok'];
        return ['Netral', 'warn'];
      };
      // Urutkan agar konsisten: tampilkan urut sesuai label
      const left = latestHands.find(h => h.label === 'Left');
      const right = latestHands.find(h => h.label === 'Right');
      const [lt, lc] = fmt(left);
      const [rt, rc] = fmt(right);
      gestureLEl.textContent = lt;
      gestureLEl.className = lc;
      gestureREl.textContent = rt;
      gestureREl.className = rc;
    }

    // Inti state machine. Setiap blok if(sm.state === ...) menangani satu
    // state dan boleh mengubah `sm.state` lewat setState() saat trigger
    // gesture-nya muncul. Blok dieksekusi top-down per frame, jadi transisi
    // ke state baru baru efektif di frame berikutnya.
    function tickStateMachine(now) {
      const hand1 = latestHands[0];
      const hand2 = latestHands[1];

      // ----- Clap detection (butuh dua tangan, palm berdekatan) -----
      let clapTriggered = false;
      if (latestHands.length === 2) {
        const d = dist(hand1.palm, hand2.palm);
        if (d < CLAP_DIST_NORM) {
          sm.clapFramesClose++;
        } else {
          sm.clapFramesClose = 0;
        }
        if (sm.clapFramesClose >= CLAP_FRAMES && now > sm.clapDebounceUntil) {
          clapTriggered = true;
          sm.clapDebounceUntil = now + CLAP_DEBOUNCE_MS;
          sm.clapFramesClose = 0;
          flash();
        }
      } else {
        sm.clapFramesClose = 0;
      }

      // Clap berperilaku berbeda tergantung state:
      //  - IDLE  : spawn kubus di tengah dua tangan
      //  - lainnya (SPAWNED/GRABBED/UNFOLDED): despawn kubus → kembali ke IDLE
      if (clapTriggered) {
        if (sm.state === STATES.IDLE && latestHands.length === 2) {
          const mid = {
            x: (hand1.palm.x + hand2.palm.x) / 2,
            y: (hand1.palm.y + hand2.palm.y) / 2,
          };
          const world = landmarkToWorld(mid);
          sm.pos.copy(world);
          sm.smoothPos.copy(world);
          sm.hasSmooth = true;
          sm.scale = 0.001;
          sm.targetScale = 1.0;
          sm.targetFade = 1.0;
          sm.unfold = 0;
          sm.targetUnfold = 0;
          setState(STATES.SPAWNED, ' ✊ genggam dekat kubus untuk memindahkan');
        }
      }

      // ----- SPAWNED: cek grab -----
      // Cari tangan dengan fist terdekat ke kubus. Jika dalam GRAB_DIST_WORLD
      // → transisi ke GRABBED. nearestDist juga dipakai untuk highlight visual
      // (kubus berkedip ungu saat tangan dekat = "ready to grab").
      if (sm.state === STATES.SPAWNED) {
        sm.targetFade = 1.0;
        sm.targetUnfold = 0;   // di SPAWNED, kubus tetap dalam bentuk kubus

        let nearestDist = Infinity;
        let nearestIdx = -1;
        let fistNearIdx = -1;
        for (let i = 0; i < latestHands.length; i++) {
          const d = latestHands[i].palmWorld.distanceTo(sm.pos);
          if (d < nearestDist) { nearestDist = d; nearestIdx = i; }
          if (latestHands[i].isFist && d < GRAB_DIST_WORLD) {
            fistNearIdx = i;
          }
        }
        sm.highlight = (nearestIdx >= 0 && nearestDist < GRAB_DIST_WORLD) ? 1 : 0;

        if (fistNearIdx >= 0) {
          sm.grabHandIdx = fistNearIdx;
          sm.grabFromState = STATES.SPAWNED;
          setState(STATES.GRABBED, '✋ Buka tangan untuk melepaskan • genggam kedua tangan untuk membuka jaring');
          sm.scale = 1.15;
        }

        // check thumbs up untuk despawn (alternatif selain clap)
        if (latestHands.some(h => h.isThumbsUp)) {
          setState(STATES.IDLE, '👍 Jempol terdeteksi, kubus akan dihapus');
        }
      }

      // ----- GRABBED: ikuti tangan, atau spread untuk unfold -----
      // Dua jalur:
      //  (a) Trigger UNFOLD: butuh dua fist + jarak palm > SPREAD_DIST_NORM
      //      konsisten selama SPREAD_FRAMES frame.
      //  (b) Follow: kubus mengejar palm tangan menggenggam terdekat.
      //      Kalau tidak ada fist dalam jangkauan & debounce lewat → release
      //      kembali ke state asal (SPAWNED atau UNFOLDED).
      if (sm.state === STATES.GRABBED) {
        // Cek trigger dua-fist spread → UNFOLDED (hanya jika sedang grab dari kubus folded)
        const canUnfoldFromGrab = sm.grabFromState === STATES.SPAWNED;
        if (canUnfoldFromGrab && latestHands.length === 2 && hand1.isFist && hand2.isFist) {
          const palmDist = dist(hand1.palm, hand2.palm);
          if (palmDist > SPREAD_DIST_NORM) {
            sm.spreadOpenFrames++;
          } else {
            sm.spreadOpenFrames = 0;
          }
        } else {
          sm.spreadOpenFrames = 0;
        }
        if (sm.spreadOpenFrames >= SPREAD_FRAMES) {
          sm.spreadOpenFrames = 0;
          sm.targetUnfold = 1;
          sm.grabHandIdx = -1;
          setState(STATES.UNFOLDED, '🪧 Jaring-jaring kubus aktif. 👏 Tepuk untuk menghilangkan.');
        } else {
          // Follow tangan menggenggam terdekat
          let best = -1;
          let bestD = Infinity;
          for (let i = 0; i < latestHands.length; i++) {
            if (!latestHands[i].isFist) continue;
            const d = latestHands[i].palmWorld.distanceTo(sm.smoothPos);
            if (d < bestD) { bestD = d; best = i; }
          }
          if (best >= 0 && bestD < GRAB_DIST_WORLD * 2.0) {
            const target = latestHands[best].palmWorld;
            target.x = Math.max(-BOUND, Math.min(BOUND, target.x));
            target.y = Math.max(-BOUND, Math.min(BOUND, target.y));
            sm.pos.copy(target);
            sm.grabReleaseDebounceUntil = now + RELEASE_DEBOUNCE_MS;
          } else if (now > sm.grabReleaseDebounceUntil) {
            sm.grabHandIdx = -1;
            const back = sm.grabFromState === STATES.UNFOLDED ? STATES.UNFOLDED : STATES.SPAWNED;
            setState(back, '✊ Genggam dekat kubus untuk mengambilnya lagi');
          }
        }
        sm.highlight = 1;
      }

      // ----- Pinch resize (aktif saat SPAWNED atau UNFOLDED): jarak antar dua telunjuk = skala
      if (sm.state === STATES.SPAWNED || sm.state === STATES.UNFOLDED) {
        const pointingHands = latestHands.filter(h => h.isPointing);
        if (pointingHands.length >= 2) {
          const a = pointingHands[0].indexTipWorld;
          const b = pointingHands[1].indexTipWorld;
          const d = a.distanceTo(b);
          if (!sm.pinchActive) {
            sm.pinchBaseDist = Math.max(d, 0.05);
            sm.pinchBaseScale = sm.targetScale;
            sm.pinchActive = true;
          } else {
            const ratio = d / sm.pinchBaseDist;
            sm.targetScale = Math.max(PINCH_SCALE_MIN, Math.min(PINCH_SCALE_MAX, sm.pinchBaseScale * ratio));
          }
          sm.highlight = 1;
        } else {
          sm.pinchActive = false;
        }
      } else {
        sm.pinchActive = false;
      }

      // ----- UNFOLDED: jaring-jaring aktif, tunggu clap untuk despawn -----
      // Beberapa interaksi paralel di state ini:
      //  • Re-grab fist (tanpa pointing) → GRABBED.
      //  • Telunjuk dekat kubus → drag rotasi cubeGroup di sumbu X & Y.
      //  • Thumbs-up (sekali per gesture, via thumbsLatched) → cycle pola NET.
      //  • Fist + pointing dengan jarak palm besar → fold balik ke SPAWNED.
      if (sm.state === STATES.UNFOLDED) {
        sm.targetFade = 1.0;
        sm.targetUnfold = 1;

        // Grab dari UNFOLDED: fist dekat kubus, dan tidak ada tangan lain pointing
        // (agar tidak konflik dengan trigger fold-balik yang butuh fist+pointing)
        const anyPointing = latestHands.some(h => h.isPointing);
        if (!anyPointing) {
          let fistNearIdxU = -1;
          for (let i = 0; i < latestHands.length; i++) {
            if (!latestHands[i].isFist) continue;
            const d = latestHands[i].palmWorld.distanceTo(sm.smoothPos);
            if (d < GRAB_DIST_WORLD) { fistNearIdxU = i; break; }
          }
          if (fistNearIdxU >= 0) {
            sm.grabHandIdx = fistNearIdxU;
            sm.grabFromState = STATES.UNFOLDED;
            setState(STATES.GRABBED, '✋ Buka tangan untuk melepaskan');
          }
        }

        // Rotasi via satu telunjuk menyentuh kubus (skip kalau sedang pinch resize)
        let touchHand = null;
        if (!sm.pinchActive) {
          for (const h of latestHands) {
            if (!h.isPointing) continue;
            const d = h.indexTipWorld.distanceTo(sm.smoothPos);
            if (d < ROTATE_TOUCH_DIST) { touchHand = h; break; }
          }
        }
        if (touchHand) {
          if (sm.rotateLastIndex && sm.rotateActive) {
            const dx = touchHand.indexTipWorld.x - sm.rotateLastIndex.x;
            const dy = touchHand.indexTipWorld.y - sm.rotateLastIndex.y;
            cubeGroup.rotation.y += dx * ROTATE_SENSITIVITY;
            cubeGroup.rotation.x += -dy * ROTATE_SENSITIVITY;
          }
          sm.rotateLastIndex = touchHand.indexTipWorld.clone();
          sm.rotateActive = true;
          sm.highlight = 1;
        } else {
          sm.rotateActive = false;
          sm.rotateLastIndex = null;
        }

        // 👍 Thumbs up terdeteksi → cycle ke pola jaring-jaring berikutnya.
        // Pakai debounce agar tidak men-trigger berulang selama gesture aktif;
        // butuh thumbsup hilang dulu sebelum bisa trigger lagi (tracked via flag).
        const thumbsHand = latestHands.find(h => h.isThumbsUp) || null;
        if (thumbsHand && !sm.thumbsLatched && now > sm.swipeDebounceUntil) {
          currentNetIdx = (currentNetIdx + 1) % NETS.length;
          sm.swipeDebounceUntil = now + SWIPE_DEBOUNCE_MS;
          sm.thumbsLatched = true;
          netLabel.textContent = NETS[currentNetIdx].name;
          hintEl.textContent = `🔀 Pola: ${NETS[currentNetIdx].name}`;
        } else if (!thumbsHand) {
          sm.thumbsLatched = false;
        }

        if (latestHands.length === 2 && ((hand1.isPointing && hand2.isFist) || (hand1.isFist && hand2.isPointing))) {
          const palmDist = dist(hand1.palm, hand2.palm);
          if (palmDist > SPREAD_DIST_NORM) {
            sm.spreadOpenFrames++;
          } else {
            sm.spreadOpenFrames = 0;
          }
        } else {
          sm.spreadOpenFrames = 0;
        }
        if (sm.spreadOpenFrames >= SPREAD_FRAMES) {
          sm.spreadOpenFrames = 0;
          sm.targetUnfold = 0;
          sm.grabHandIdx = -1;
          setState(STATES.SPAWNED, '🪧 Jaring-jaring kubus aktif. 👏 Tepuk untuk menghilangkan.');
        }
      }

      // ----- Idle hint default -----
      if (sm.state === STATES.IDLE) {
        sm.targetFade = 0;
        sm.targetScale = 0.001;
        sm.targetUnfold = 0;
        hintEl.textContent = '👏 Tepuk tangan untuk memunculkan kubus';
      }
    }

    // Render loop utama. Semua animasi & feedback visual (warna neon,
    // pulse halo, auto-rotate) dihitung di sini.
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;

      fpsAccum += 1 / Math.max(dt, 1e-4);
      fpsCount++;
      if (fpsCount >= 20) {
        fpsEl.textContent = Math.round(fpsAccum / fpsCount);
        fpsAccum = 0; fpsCount = 0;
      }

      updateHud();
      tickStateMachine(now);

      // Smoothing posisi
      if (sm.hasSmooth) {
        sm.smoothPos.lerp(sm.pos, SMOOTHING);
      }

      // Fade & scale lerp
      sm.fade += (sm.targetFade - sm.fade) * Math.min(1, (sm.targetFade > sm.fade ? FADE_IN_SPEED : FADE_OUT_SPEED) * dt);
      sm.scale += (sm.targetScale - sm.scale) * Math.min(1, SCALE_SPEED * dt);

      // Unfold lerp + apply ke hierarchy face
      sm.unfold += (sm.targetUnfold - sm.unfold) * Math.min(1, UNFOLD_SPEED * dt);
      const easedUnfold = sm.unfold < 0.001 ? 0 : (sm.unfold > 0.999 ? 1 : sm.unfold);
      setUnfold(easedUnfold);

      const visible = sm.fade > 0.01;
      cubeGroup.visible = visible;
      if (visible) {
        cubeGroup.position.copy(sm.smoothPos);
        cubeGroup.scale.setScalar(sm.scale);
        // Auto-rotate hanya saat masih bentuk kubus; freeze saat unfolded.
        const spinFactor = 1 - sm.unfold;
        cubeGroup.rotation.y += dt * 0.5 * spinFactor;

        fillMat.opacity = 0.18 * sm.fade;
        wireMat.opacity = 1.0 * sm.fade;
        haloMat.opacity = 0.4 * sm.fade;

        // glow naik saat ready-to-grab / grabbed / unfolded
        const isInteracting = sm.state === STATES.GRABBED || sm.state === STATES.UNFOLDED;
        const glowTarget = (isInteracting ? 0.4 : (sm.highlight ? 0.22 : 0.1)) * sm.fade;
        glowMat.opacity += (glowTarget - glowMat.opacity) * Math.min(1, 6 * dt);

        // warna neon berubah sesuai state
        const targetColor = sm.state === STATES.UNFOLDED
          ? 0x9d4dff                   // neon purple saat jaring-jaring
          : (sm.state === STATES.GRABBED
            ? NEON_GRAB
            : (sm.highlight ? NEON_HIGHLIGHT : NEON_COLOR));
        const targetCol = new THREE.Color(targetColor);
        wireMat.color.lerp(targetCol, Math.min(1, 6 * dt));
        fillMat.color.lerp(targetCol, Math.min(1, 6 * dt));
        haloMat.color.lerp(targetCol, Math.min(1, 6 * dt));
        glowMat.color.lerp(targetCol, Math.min(1, 6 * dt));

        // pulse halus pada ketebalan halo
        const pulse = 1 + Math.sin(now * 0.005) * 0.15;
        haloMat.linewidth = 14 * pulse;
      }

      renderer.render(scene, camera);
    }

    // ---------------------------------------------------------------------
    // [8] BOOT — inisialisasi MediaPipe Hands + utility Camera dari
    // @mediapipe/camera_utils. Camera mengambil frame dari <video> dan
    // memanggil hands.send() pada interval optimal sesuai device.
    // boot() di-IIFE: cek dukungan getUserMedia → start → mulai animate().
    // ---------------------------------------------------------------------
    async function startMediaPipe() {
      if (typeof Hands === 'undefined' || typeof Camera === 'undefined') {
        throw new Error('Library MediaPipe gagal dimuat. Periksa koneksi internet.');
      }
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`,
      });
      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 0,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.5,
      });
      hands.onResults(onResults);

      const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
      const cam = new Camera(videoEl, {
        onFrame: async () => { await hands.send({ image: videoEl }); },
        width: isMobile ? 480 : 640,
        height: isMobile ? 360 : 480,
        facingMode: 'user',
      });
      await cam.start();
    }

    (async function boot() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('Browser tidak mendukung akses kamera (getUserMedia).');
        }
        loaderText.innerHTML = 'Meminta akses kamera...';
        await startMediaPipe();
        loaderText.innerHTML = 'Siap! 👏 Tepuk tangan untuk memulai.';
        setTimeout(() => loaderEl.classList.add('hidden'), 500);
        requestAnimationFrame(animate);
      } catch (err) {
        console.error(err);
        errorMsg.textContent = err.message || 'Terjadi kesalahan tak terduga.';
        errorEl.classList.add('show');
        loaderEl.classList.add('hidden');
      }
    })();
  </script>
</body>
