<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>WebAR Hand Tracking | Clap & Grab</title>
  <link rel="stylesheet" href="css/ar-common.css">
  <style>
    /* ---------- Page-specific: camera & canvas stack ---------- */
    #container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: var(--z-camera);
    }

    #three-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: var(--z-three);
      pointer-events: none;
    }

    #hand-canvas {
      /* Dimensi canvas = frame video, lalu di-scale & mirror via CSS sama
         persis dengan video element di belakangnya. Landmark MediaPipe
         (0..1) langsung 1:1 dengan pixel canvas — tanpa konversi manual. */
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: var(--z-hand);
      pointer-events: none;
    }

    /* ---------- Page-specific: white flash effect ---------- */
    #flash {
      position: absolute;
      inset: 0;
      z-index: var(--z-fx);
      background: #fff;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="container">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="three-canvas"></canvas>
    <canvas id="hand-canvas"></canvas>
    <div id="flash"></div>

    <div id="hud">
      <div class="badge">
        <div>State: <b id="state-label">IDLE</b></div>
        <div>Net: <span id="net-label" class="warn">cross</span></div>
        <div>Hands: <span id="hands-count" class="muted">0</span></div>
        <div>L: <span id="gesture-l" class="muted">—</span></div>
        <div>R: <span id="gesture-r" class="muted">—</span></div>
        <div>FPS: <span id="fps" class="muted">0</span></div>
      </div>
      <a href="index.html" id="back-btn">← Kembali</a>
    </div>

    <div id="hint">👏 Tepuk tangan untuk memunculkan kubus</div>

    <div id="loader">
      <div class="spinner"></div>
      <p id="loader-text">Memuat model hand tracking...<br>Izinkan akses kamera saat diminta.</p>
    </div>

    <div id="error">
      <div class="box">
        <h3>Tidak dapat memulai AR</h3>
        <p id="error-msg">Pastikan browser memiliki izin kamera dan koneksi internet aktif.</p>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
    crossorigin="anonymous"></script>

  <script type="module">
    /* =====================================================================
     * WebAR Hand Tracking — Clap & Grab
     * ---------------------------------------------------------------------
     * Alur tingkat tinggi:
     *   1. MediaPipe Hands membaca frame dari <video> (kamera depan) dan
     *      menghasilkan landmark 21 titik per tangan setiap frame.
     *   2. onResults() menyaring landmark itu menjadi struktur `latestHands`
     *      yang berisi gesture flags (fist/open/thumbsUp/pointing) +
     *      koordinat dunia 3D dari telapak & ujung telunjuk.
     *   3. Setiap frame requestAnimationFrame, animate() memanggil
     *      tickStateMachine() untuk berpindah antar state berdasarkan
     *      gesture, lalu meng-update Three.js scene (posisi, skala, fade,
     *      derajat unfold jaring-jaring kubus).
     *
     * State machine: IDLE → SPAWNED → GRABBED → UNFOLDED
     *   IDLE      : tidak ada kubus. Tepuk tangan (clap) → SPAWNED.
     *   SPAWNED   : kubus muncul, auto-rotate. Genggam (fist) dekat kubus
     *               → GRABBED. Clap lagi atau thumbs-up → IDLE.
     *   GRABBED   : kubus mengikuti telapak. Lepas (tangan menjauh) →
     *               kembali ke state asal. Dua fist + spread → UNFOLDED.
     *   UNFOLDED  : kubus terbuka jadi jaring-jaring. Telunjuk menyentuh →
     *               rotasi. Thumbs-up → cycle pola jaring berikutnya.
     *               Fist+pointing spread → fold balik. Clap → IDLE.
     *
     * Pinch resize (dua telunjuk) aktif pada SPAWNED & UNFOLDED.
     * ===================================================================== */

    import * as THREE from 'three';
    import { Line2 } from 'three/addons/lines/Line2.js';
    import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
    import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';

    // ---------------------------------------------------------------------
    // [1] DOM REFS — elemen yang dimanipulasi langsung (HUD, loader, dll)
    // ---------------------------------------------------------------------
    const videoEl = document.getElementById('video');
    const canvasEl = document.getElementById('three-canvas');
    const handCanvas = document.getElementById('hand-canvas');
    const handCtx = handCanvas.getContext('2d');
    const stateLabel = document.getElementById('state-label');
    const netLabel = document.getElementById('net-label');
    const handsCountEl = document.getElementById('hands-count');
    const gestureLEl = document.getElementById('gesture-l');
    const gestureREl = document.getElementById('gesture-r');
    const fpsEl = document.getElementById('fps');
    const hintEl = document.getElementById('hint');
    const flashEl = document.getElementById('flash');
    const loaderEl = document.getElementById('loader');
    const loaderText = document.getElementById('loader-text');
    const errorEl = document.getElementById('error');
    const errorMsg = document.getElementById('error-msg');

    // ---------------------------------------------------------------------
    // [2] THREE.JS SETUP — scene, kamera perspektif, renderer transparan
    // di atas <video>. alpha:true agar feed kamera tetap terlihat di belakang.
    // ---------------------------------------------------------------------
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 2);

    const renderer = new THREE.WebGLRenderer({
      canvas: canvasEl,
      alpha: true,
      antialias: window.devicePixelRatio < 2,
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.setClearColor(0x000000, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
    dirLight.position.set(1, 2, 3);
    scene.add(dirLight);

    // ---------------------------------------------------------------------
    // [3] CUBE GROUP & MATERIALS
    // cubeGroup = container untuk 6 face. Kita render setiap face sebagai
    // plane terpisah agar bisa di-"unfold" (interpolasi antara posisi folded
    // dan posisi pada bidang datar) dengan mudah.
    // ---------------------------------------------------------------------
    const CUBE_SIZE = 0.32;
    const NEON_COLOR = 0x00ffe7;
    const NEON_GRAB = 0x39ff14;
    const NEON_HIGHLIGHT = 0xff2bd6;
    const NEON_GLOW = 0x00ffff;

    // Geometri di-share antar semua kubus (immutable). Material per-kubus
    // dibuat lewat createCube() agar warna/opacity bisa berubah independen.
    const faceGeo = new THREE.PlaneGeometry(CUBE_SIZE, CUBE_SIZE);
    const HALF = CUBE_SIZE / 2;
    const faceEdges = new THREE.EdgesGeometry(faceGeo);
    const faceLineSegGeo = new LineSegmentsGeometry().fromEdgesGeometry(faceEdges);

    // Buat texture kanvas berisi angka (1..6) untuk label face.
    // Hasilnya berupa Mesh plane kecil yang ditempel di tengah face.
    function makeNumberSprite(n) {
      const size = 256;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, size, size);
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#00ffe7';
      ctx.lineWidth = 8;
      ctx.font = 'bold 180px "Segoe UI", Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#00ffe7';
      ctx.shadowBlur = 24;
      ctx.fillText(String(n), size / 2, size / 2 + 6);
      ctx.shadowBlur = 0;
      ctx.strokeText(String(n), size / 2, size / 2 + 6);
      const tex = new THREE.CanvasTexture(c);
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      const mat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
      });
      const labelSize = CUBE_SIZE * 0.7;
      const labelGeo = new THREE.PlaneGeometry(labelSize, labelSize);
      return new THREE.Mesh(labelGeo, mat);
    }

    // ===== Flat hierarchy: setiap face = child langsung group kubus =====
    // Plane default di XY (normal +Z). Posisi face = pusat plane.
    function makeFace(number, fillMat, wireMat, haloMat) {
      const g = new THREE.Group();
      const fill = new THREE.Mesh(faceGeo, fillMat);
      g.add(fill);
      const wire = new Line2(faceLineSegGeo, wireMat); wire.computeLineDistances(); g.add(wire);
      const halo = new Line2(faceLineSegGeo, haloMat); halo.computeLineDistances(); g.add(halo);
      if (number !== undefined) {
        const label = makeNumberSprite(number);
        label.position.set(0, 0, 0.002);
        g.add(label);
      }
      return g;
    }

    const PI2 = Math.PI / 2;

    // Folded transforms (bentuk kubus). Sama untuk semua net.
    // Plane default normal +Z. Tiap face dirotasi agar normal-nya menghadap ke luar.
    const FOLDED = {
      bottom: { pos: [0, -HALF, 0], rot: [+PI2, 0, 0] },  // normal -Y
      top: { pos: [0, +HALF, 0], rot: [-PI2, 0, 0] },  // normal +Y
      front: { pos: [0, 0, +HALF], rot: [0, 0, 0] },  // normal +Z
      back: { pos: [0, 0, -HALF], rot: [0, Math.PI, 0] }, // normal -Z
      right: { pos: [+HALF, 0, 0], rot: [0, +PI2, 0] },  // normal +X
      left: { pos: [-HALF, 0, 0], rot: [0, -PI2, 0] },  // normal -X
    };

    // Helper: posisi unfolded di lantai y=-HALF, plane normal +Y (rot X = -PI/2),
    // grid coord (gx, gz) menggeser di sumbu X dan Z dengan satuan CUBE_SIZE.
    // rotZ tambahan opsional untuk menjaga orientasi label tetap upright.
    function flat(gx, gz, rotZ = 0) {
      return { pos: [gx * CUBE_SIZE, -HALF, gz * CUBE_SIZE], rot: [-PI2, 0, rotZ] };
    }

    // 3 NET: cross (T-shape), plus (Latin cross), strip (1-4-1).
    // Layout dilihat dari atas (top-down view, +X kanan, +Z ke depan).
    //
    // CROSS:           PLUS:            STRIP:
    //     [1]              [1]              [1]
    // [4][6][3][5]      [4][6][3]      [6][3][5][4]
    //     [2]              [5]              [2]
    //                      [2]
    // Tata letak (top-down view): center = bottom face. Grid coord (gx, gz).
    // CROSS (T):           PLUS (Latin cross):       STRIP (1-4-1):
    //       [1] z=-2             [1] z=-1               [1]  z=-1
    //       [5] z=-1         [4][6][3]                  [6][3][5][4] ← row z=0
    //   [4][6][3] z=0            [5] z=+1               [2]  z=+1
    //       [2] z=+1             [2] z=+2
    // 11 net hexomino valid kubus. Format: 4 face dalam satu baris (column gx ∈ [0..3] di z=0)
    // adalah "spine"; face top/front menempel ke salah satu cell spine via z=±1.
    // Konvensi grid: bottom selalu di (0,0). Spine berisi: bottom(0), right(1), back(2), left(3).
    // top/front ditempatkan di z=-1 atau z=+1 pada salah satu kolom spine (atau membentuk variasi 2-3-1, 2-2-2, 3-3).
    const NETS = [
      // ===== 1-4-1 family (6 net): spine 4 face di z=0; top & front di z=-1 dan z=+1 =====
      {
        name: '1-4-1 a',
        bottom: flat(0, 0), right: flat(1, 0), back: flat(2, 0), left: flat(3, 0),
        top:    flat(0, -1), front: flat(0, 1),
      },
      {
        name: '1-4-1 b',
        bottom: flat(0, 0), right: flat(1, 0), back: flat(2, 0), left: flat(3, 0),
        top:    flat(0, -1), front: flat(1, 1),
      },
      {
        name: '1-4-1 c',
        bottom: flat(0, 0), right: flat(1, 0), back: flat(2, 0), left: flat(3, 0),
        top:    flat(0, -1), front: flat(2, 1),
      },
      {
        name: '1-4-1 d',
        bottom: flat(0, 0), right: flat(1, 0), back: flat(2, 0), left: flat(3, 0),
        top:    flat(1, -1), front: flat(2, 1),
      },
      {
        name: 'cross',
        bottom: flat(0, 0), right: flat(1, 0), back: flat(2, 0), left: flat(3, 0),
        top:    flat(1, -1), front: flat(1, 1),
      },
      {
        name: '1-4-1 f',
        bottom: flat(0, 0), right: flat(1, 0), back: flat(2, 0), left: flat(3, 0),
        top:    flat(2, -1), front: flat(1, 1),
      },
      // ===== 2-3-1 family (3 net): spine 3 face di z=0 (kolom 0..2), 1 face menonjol di z=-1 atau z=+1, dan 2 face menempel sebagai pasangan =====
      {
        name: '2-3-1 a',
        bottom: flat(0, 0), right: flat(1, 0), back: flat(2, 0),
        front:  flat(2, 1), left:  flat(3, 1), top: flat(0, -1),
      },
      {
        name: '2-3-1 b',
        bottom: flat(0, 0), right: flat(1, 0), back: flat(2, 0),
        front:  flat(2, 1), left:  flat(3, 1), top: flat(1, -1),
      },
      {
        name: '2-3-1 c',
        bottom: flat(0, 0), right: flat(1, 0), back: flat(2, 0),
        front:  flat(2, 1), left:  flat(3, 1), top: flat(2, -1),
      },
      // ===== 2-2-2 family (1 net): zigzag/staircase =====
      {
        name: 'zigzag',
        top:    flat(0, -1), bottom: flat(0, 0),
        right:  flat(1, 0),  back:  flat(1, 1),
        left:   flat(2, 1),  front: flat(2, 2),
      },
      // ===== 3-3 family (1 net): dua baris 3 face, offset =====
      {
        name: '3-3',
        bottom: flat(0, 0), right: flat(1, 0), back: flat(2, 0),
        top:    flat(1, 1), left:  flat(2, 1), front: flat(3, 1),
      },
    ];
    let currentNetIdx = 0;

    // Kumpulan Quaternion+Vector3 helpers untuk lerp transform
    const _qFold = new THREE.Quaternion();
    const _qUnfold = new THREE.Quaternion();
    const _qOut = new THREE.Quaternion();
    const _eFold = new THREE.Euler();
    const _eUnfold = new THREE.Euler();
    const _vFold = new THREE.Vector3();
    const _vUnfold = new THREE.Vector3();

    // Interpolasi tiap face antara FOLDED (kubus utuh) dan NETS[currentNetIdx]
    // (jaring-jaring datar). t=0 → kubus, t=1 → flat.
    function setUnfold(cube, t) {
      const a = THREE.MathUtils.clamp(t, 0, 1);
      const net = NETS[currentNetIdx];
      for (const key of Object.keys(cube.faceMeshes)) {
        const mesh = cube.faceMeshes[key];
        const f = FOLDED[key];
        const u = net[key];
        _vFold.fromArray(f.pos);
        _vUnfold.fromArray(u.pos);
        mesh.position.lerpVectors(_vFold, _vUnfold, a);
        _eFold.set(f.rot[0], f.rot[1], f.rot[2]);
        _eUnfold.set(u.rot[0], u.rot[1], u.rot[2]);
        _qFold.setFromEuler(_eFold);
        _qUnfold.setFromEuler(_eUnfold);
        _qOut.slerpQuaternions(_qFold, _qUnfold, a);
        mesh.quaternion.copy(_qOut);
      }
    }

    // State enum (dipakai oleh factory & state machine)
    const STATES = { IDLE: 'IDLE', SPAWNED: 'SPAWNED', GRABBED: 'GRABBED', UNFOLDED: 'UNFOLDED' };

    // ---------------------------------------------------------------------
    // [Cube Factory] — bikin satu kubus dengan group + material instance
    // sendiri + state object sendiri. Warna grab/highlight tidak bocor antar
    // kubus karena material per-cube.
    // ---------------------------------------------------------------------
    function createCube() {
      const group = new THREE.Group();
      group.visible = false;
      scene.add(group);

      const fillMat = new THREE.MeshBasicMaterial({
        color: NEON_COLOR,
        transparent: true,
        opacity: 0.18,
        depthWrite: false,
        side: THREE.DoubleSide,
      });
      const wireMat = new LineMaterial({
        color: NEON_COLOR,
        linewidth: 6,
        transparent: true,
        opacity: 1.0,
        depthTest: true,
        worldUnits: false,
      });
      wireMat.resolution.set(window.innerWidth, window.innerHeight);
      const haloMat = new LineMaterial({
        color: NEON_GLOW,
        linewidth: 14,
        transparent: true,
        opacity: 0.35,
        depthTest: true,
        blending: THREE.AdditiveBlending,
        worldUnits: false,
      });
      haloMat.resolution.set(window.innerWidth, window.innerHeight);

      const faceMeshes = {
        bottom: makeFace(6, fillMat, wireMat, haloMat),
        top: makeFace(1, fillMat, wireMat, haloMat),
        front: makeFace(2, fillMat, wireMat, haloMat),
        back: makeFace(5, fillMat, wireMat, haloMat),
        right: makeFace(3, fillMat, wireMat, haloMat),
        left: makeFace(4, fillMat, wireMat, haloMat),
      };
      for (const k in faceMeshes) group.add(faceMeshes[k]);

      const cube = {
        group, faceMeshes, fillMat, wireMat, haloMat,
        state: {
          state: STATES.IDLE,
          pos: new THREE.Vector3(0, 0, 0),
          smoothPos: new THREE.Vector3(0, 0, 0),
          hasSmooth: false,
          scale: 0.001,
          targetScale: 0.001,
          fade: 0,
          targetFade: 0,
          grabHandIdx: -1,
          grabFromState: null,
          grabReleaseDebounceUntil: 0,
          unfold: 0,
          targetUnfold: 0,
          spreadOpenFrames: 0,
          rotateLastIndex: null,
          rotateActive: false,
          swipeDebounceUntil: 0,
          thumbsLatched: false,
          pinchBaseDist: 0,
          pinchBaseScale: 1,
          pinchActive: false,
          highlight: 0,
          spawnCooldownUntil: 0,
        },
      };
      setUnfold(cube, 0);
      return cube;
    }

    // Array semua kubus yang ada di scene. Mulai dengan 1 slot IDLE.
    const cubes = [createCube()];

    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
      for (const c of cubes) {
        c.wireMat.resolution.set(w, h);
        c.haloMat.resolution.set(w, h);
      }
    }
    window.addEventListener('resize', onResize);
    onResize();

    // ---------------------------------------------------------------------
    // [4] GESTURE DETECTION HELPERS
    // Semua bekerja pada landmark MediaPipe (lm[0..20]) dalam koordinat
    // ternormalisasi 0..1 (x,y) + z relatif. Indeks penting:
    //   0  = wrist
    //   4  = thumb tip,  3 = thumb IP
    //   8  = index tip,  5 = index MCP
    //   12 = middle tip, 9  = middle MCP
    //   16 = ring tip,   13 = ring MCP
    //   20 = pinky tip,  17 = pinky MCP
    // ---------------------------------------------------------------------
    function dist(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const dz = (a.z || 0) - (b.z || 0);
      return Math.sqrt(dx * dx + dy * dy + dz * dz);
    }

    function palmCenter(lm) {
      const idxs = [0, 5, 9, 13, 17];
      let x = 0, y = 0, z = 0;
      for (const i of idxs) {
        x += lm[i].x; y += lm[i].y; z += lm[i].z || 0;
      }
      return { x: x / idxs.length, y: y / idxs.length, z: z / idxs.length };
    }

    function palmSize(lm) {
      return dist(lm[0], lm[9]);
    }

    function isClosedFist(lm) {
      // not thumbs up, tapi genggaman biasa: semua jari (kecuali ibu jari) terlipat dekat telapak
      if (isThumbsUp(lm) || isPointing(lm)) return false;

      const wrist = lm[0];
      const tips = [8, 12, 16, 20];
      const mcps = [5, 9, 13, 17];
      let folded = 0;
      for (let i = 0; i < tips.length; i++) {
        const dTip = dist(lm[tips[i]], wrist);
        const dMcp = dist(lm[mcps[i]], wrist);
        if (dTip < dMcp * 1.05) folded++;
      }
      return folded >= 3;
    }

    function isOpenHand(lm) {
      const palm = palmCenter(lm);
      const tips = [8, 12, 16, 20];
      const ps = palmSize(lm);
      let extended = 0;
      for (const t of tips) {
        if (dist(lm[t], palm) > ps * 1.3) extended++;
      }
      return extended >= 3;
    }

    function isThumbsUp(lm) {
      if (isPointing(lm)) return false; // jangan sampai salah deteksi pointing sebagai thumbs up
      const wrist = lm[0];
      const thumbTip = lm[4];
      const thumbIP = lm[3]; // sendi sebelum ujung ibu jari

      const tips = [8, 12, 16, 20]; // jari lain
      const mcps = [5, 9, 13, 17];

      // 1. Cek jari lain terlipat (seperti fist)
      let folded = 0;
      for (let i = 0; i < tips.length; i++) {
        const dTip = dist(lm[tips[i]], wrist);
        const dMcp = dist(lm[mcps[i]], wrist);
        if (dTip < dMcp * 1.05) folded++;
      }

      // minimal 3 jari terlipat
      const fingersFolded = folded >= 4;

      // 2. Cek ibu jari terbuka (menjauh dari telapak)
      const palm = palmCenter(lm);
      const ps = palmSize(lm);
      const thumbExtended = dist(thumbTip, palm) > ps * 1.2;

      // 3. Cek arah ibu jari ke atas
      // (ingat: koordinat y makin kecil = makin ke atas)
      const thumbUp = thumbTip.y < thumbIP.y;

      return fingersFolded && thumbExtended && thumbUp;
    }

    function isPointing(lm) {
      // Exclusive dari two-finger rotate: kalau jari tengah juga extended &
      // dirapatkan ke telunjuk, ini gesture rotate, bukan pointing.
      if (isTwoFingerRotate(lm)) return false;

      const wrist = lm[0];

      // index finger (telunjuk)
      const indexTip = lm[8];
      const indexMcp = lm[5];

      // jari lain
      const otherTips = [12, 16, 20];
      const otherMcps = [9, 13, 17];

      // 1. cek telunjuk terbuka
      const dIndexTip = dist(indexTip, wrist);
      const dIndexMcp = dist(indexMcp, wrist);
      const indexExtended = dIndexTip > dIndexMcp * 1.2;

      // 2. cek jari lain terlipat
      let folded = 0;
      for (let i = 0; i < otherTips.length; i++) {
        const dTip = dist(lm[otherTips[i]], wrist);
        const dMcp = dist(lm[otherMcps[i]], wrist);
        if (dTip < dMcp * 1.05) folded++;
      }

      const othersFolded = folded >= 2;

      return indexExtended && othersFolded;
    }

    // Two-finger rotate gesture: telunjuk + jari tengah keduanya extended
    // dan UJUNGNYA berdekatan (rapat), sementara ring & pinky terlipat.
    function isTwoFingerRotate(lm) {
      const wrist = lm[0];
      const indexTip = lm[8], indexMcp = lm[5];
      const middleTip = lm[12], middleMcp = lm[9];
      const ringTip = lm[16], ringMcp = lm[13];
      const pinkyTip = lm[20], pinkyMcp = lm[17];

      const indexExtended = dist(indexTip, wrist) > dist(indexMcp, wrist) * 1.15;
      const middleExtended = dist(middleTip, wrist) > dist(middleMcp, wrist) * 1.15;
      if (!indexExtended || !middleExtended) return false;

      const ringFolded = dist(ringTip, wrist) < dist(ringMcp, wrist) * 1.2;
      const pinkyFolded = dist(pinkyTip, wrist) < dist(pinkyMcp, wrist) * 1.2;
      if (!ringFolded || !pinkyFolded) return false;

      // Telunjuk & tengah harus RAPAT (tip-to-tip). Threshold relatif ke
      // panjang telunjuk biar tahan jarak tangan ke kamera.
      const indexLen = dist(indexTip, indexMcp);
      const tipGap = dist(indexTip, middleTip);
      return tipGap < indexLen * 0.7;
    }
    // Konversi titik landmark (NDC 0..1, dengan x mirror karena video
    // di-flip horizontally via CSS) → posisi dunia 3D pada kedalaman tetap.
    // Dipakai untuk menempatkan kubus & menghitung jarak fist→kubus.
    function landmarkToWorld(p, depth = 1.5) {
      const ndcX = -((p.x * 2) - 1);
      const ndcY = -((p.y * 2) - 1);
      const v = new THREE.Vector3(ndcX, ndcY, 0.5);
      v.unproject(camera);
      const dir = v.sub(camera.position).normalize();
      return camera.position.clone().add(dir.multiplyScalar(depth));
    }

    // ---------------------------------------------------------------------
    // [5] STATE MACHINE
    // `sm` = state model. Selain state utama, ia juga menampung counter
    // gesture (clapFramesClose, spreadOpenFrames), debounce timestamp, dan
    // target value yang akan di-lerp di animate() (targetScale, targetFade,
    // targetUnfold). Pola counter+threshold dipakai supaya gesture harus
    // konsisten beberapa frame baru memicu, mengurangi false positive.
    // ---------------------------------------------------------------------
    // (STATES & cubes[] dideklarasi di atas factory createCube.)

    // Konstanta tuning gesture. Satuan:
    //   *_NORM  → koordinat MediaPipe ternormalisasi (0..1)
    //   *_WORLD → satuan three.js setelah landmarkToWorld()
    //   *_MS    → milidetik (debounce)
    //   *_FRAMES→ jumlah frame berturut-turut sebelum gesture dianggap valid
    const CLAP_DIST_NORM = 0.12;
    const CLAP_FRAMES = 3;
    const CLAP_DEBOUNCE_MS = 1500;
    const GRAB_DIST_WORLD = 0.45;
    const RELEASE_DEBOUNCE_MS = 200;
    const SPREAD_DIST_NORM = 0.55;
    const SPREAD_FRAMES = 8;
    const UNFOLD_SPEED = 2.5;
    const ROTATE_TOUCH_DIST = 0.6;
    const ROTATE_SENSITIVITY = 2.5;
    const PINCH_SCALE_MIN = 0.3;
    const PINCH_SCALE_MAX = 3.0;
    const SWIPE_MIN_DX = 0.7;            // jarak minimum (world units) untuk dianggap swipe
    const SWIPE_MAX_DURATION_MS = 600;   // batas waktu swipe
    const SWIPE_DEBOUNCE_MS = 1200;
    const SMOOTHING = 0.35;
    const FADE_IN_SPEED = 6.0;
    const FADE_OUT_SPEED = 4.0;
    const SCALE_SPEED = 8.0;
    const BOUND = 1.6;

    function setState(cube, next, hint) {
      if (cube.state.state !== next) {
        cube.state.state = next;
      }
      if (hint !== undefined) {
        hintEl.textContent = hint;
        hintEl.style.opacity = '1';
      }
    }

    // Tampilkan state kubus paling "menarik" di HUD + jumlah aktif.
    function refreshStateLabel() {
      const priority = { UNFOLDED: 4, GRABBED: 3, SPAWNED: 2, IDLE: 1 };
      let best = null;
      let bestP = 0;
      let active = 0;
      for (const c of cubes) {
        if (c.state.state !== STATES.IDLE) active++;
        const p = priority[c.state.state] || 0;
        if (p > bestP) { bestP = p; best = c.state.state; }
      }
      const label = best || 'IDLE';
      stateLabel.textContent = active > 1 ? `${label} ×${active}` : label;
    }

    function flash() {
      flashEl.style.transition = 'none';
      flashEl.style.opacity = '0.6';
      requestAnimationFrame(() => {
        flashEl.style.transition = 'opacity 0.4s';
        flashEl.style.opacity = '0';
      });
    }

    // ---------------------------------------------------------------------
    // [6] MEDIAPIPE RESULTS
    // Callback yang dipanggil MediaPipe Hands setiap kali ia selesai
    // memproses 1 frame. Kita normalkan output menjadi array `latestHands`
    // berisi pre-computed flags & posisi dunia agar tickStateMachine()
    // tidak perlu menghitung ulang setiap state-block.
    // ---------------------------------------------------------------------
    let latestHands = []; // [{lm, label, palmCenter, palmWorld, isFist, isOpen}]

    function onResults(results) {
      const hands = [];
      if (results.multiHandLandmarks && results.multiHandedness) {
        for (let i = 0; i < results.multiHandLandmarks.length; i++) {
          const lm = results.multiHandLandmarks[i];
          // multiHandedness label adalah dari sudut pandang gambar; karena kita mirror
          // tampilan, "Left"/"Right" akan terbalik bagi user — tidak masalah untuk logika kita.
          const label = results.multiHandedness[i].label;
          const palm = palmCenter(lm);
          hands.push({
            lm,
            label,
            palm,
            palmWorld: landmarkToWorld(palm),
            indexTipWorld: landmarkToWorld(lm[8]),
            middleTipWorld: landmarkToWorld(lm[12]),
            isFist: isClosedFist(lm),
            isOpen: isOpenHand(lm),
            isThumbsUp: isThumbsUp(lm),
            isTwoFingerRotate: isTwoFingerRotate(lm),
            isPointing: isPointing(lm),
          });
        }
      }
      latestHands = hands;
    }

    // ---------------------------------------------------------------------
    // [7] UPDATE LOOP — dipanggil per-frame via requestAnimationFrame.
    // Urutan kerja tiap frame:
    //   updateHud()         → refresh badge gesture & FPS
    //   tickStateMachine()  → transisi state berdasar latestHands
    //   smoothPos.lerp      → pelan-pelan kejar sm.pos (anti-jitter)
    //   fade/scale/unfold   → lerp menuju target
    //   apply ke cubeGroup  → posisi/skala/rotasi/warna material
    //   renderer.render     → gambar
    // ---------------------------------------------------------------------
    let lastFrame = performance.now();
    let fpsAccum = 0, fpsCount = 0;

    // ===== Audio FX =====
    // Pre-load assets/break.mp3 (unfold) dan assets/building.mp3 (fold).
    // Playback diizinkan karena getUserMedia() di awal halaman sudah jadi
    // user-gesture unlock untuk media playback.
    const breakAudio = new Audio('assets/break.mp3');
    const buildingAudio = new Audio('assets/building.mp3');
    breakAudio.preload = 'auto';
    buildingAudio.preload = 'auto';
    breakAudio.volume = 0.9;
    buildingAudio.volume = 0.9;

    // BGM futuristic — looped, volume rendah. Start ditunda hingga kubus
    // pertama spawn (clap atau charge-fist) agar terasa "menyala bersama
    // dunia AR" alih-alih bergema sebelum user berinteraksi.
    const bgmAudio = new Audio('assets/futuristic.mp3');
    bgmAudio.preload = 'auto';
    bgmAudio.loop = true;
    bgmAudio.volume = 0.25;
    let bgmStarted = false;
    function startBgm() {
      if (bgmStarted) return;
      bgmStarted = true;
      const p = bgmAudio.play();
      if (p && typeof p.catch === 'function') {
        p.catch(() => { bgmStarted = false; }); // retry next call
      }
    }

    function playAudio(el) {
      try {
        el.currentTime = 0;
        const p = el.play();
        if (p && typeof p.catch === 'function') p.catch(() => {});
      } catch (e) {
        console.warn('audio play failed', e);
      }
    }

    function updateHud() {
      handsCountEl.textContent = String(latestHands.length);
      handsCountEl.className = latestHands.length > 0 ? 'ok' : 'muted';

      const fmt = (h) => {
        if (!h) return ['—', 'muted'];
        if (h.isFist) return ['Menggenggam ✊', 'hot'];
        if (h.isOpen) return ['Terbuka ✋', 'ok'];
        if (h.isThumbsUp) return ['Jempol ke Atas 👍', 'ok'];
        if (h.isTwoFingerRotate) return ['Putar ✌️', 'ok'];
        if (h.isPointing) return ['Menunjuk 👉', 'ok'];
        return ['Netral', 'warn'];
      };
      // Urutkan agar konsisten: tampilkan urut sesuai label
      const left = latestHands.find(h => h.label === 'Left');
      const right = latestHands.find(h => h.label === 'Right');
      const [lt, lc] = fmt(left);
      const [rt, rc] = fmt(right);
      gestureLEl.textContent = lt;
      gestureLEl.className = lc;
      gestureREl.textContent = rt;
      gestureREl.className = rc;
    }

    // ---------------------------------------------------------------------
    // [Hand Skeleton Overlay] — gambar skeleton tangan di atas video feed.
    // Canvas berukuran = videoWidth × videoHeight (frame native). Landmark
    // MediaPipe (0..1) langsung 1:1 dengan pixel canvas — tidak butuh
    // konversi manual. CSS object-fit:cover + scaleX(-1) menscale+mirror
    // canvas sama persis seperti video di belakangnya.
    //
    // drawConnectors & drawLandmarks dari @mediapipe/drawing_utils (global).
    // HAND_CONNECTIONS juga global dari hands.js.
    // ---------------------------------------------------------------------
    function drawHandSkeleton() {
      if (!videoEl.videoWidth || !videoEl.videoHeight) return;
      if (handCanvas.width !== videoEl.videoWidth) {
        handCanvas.width = videoEl.videoWidth;
        handCanvas.height = videoEl.videoHeight;
      }
      handCtx.save();
      handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);
      if (!latestHands.length) {
        handCtx.restore();
        return;
      }

      for (const hand of latestHands) {
        // Warna berdasar gesture aktif (feedback visual)
        let boneColor = '#00d4ff';                              // cyan default
        if (hand.isFist) boneColor = '#f97316';                 // orange grab
        else if (hand.isTwoFingerRotate) boneColor = '#a78bfa'; // purple rotate
        else if (hand.isThumbsUp) boneColor = '#fbbf24';        // amber thumb
        else if (hand.isPointing) boneColor = '#4ade80';        // green pointing

        handCtx.save();
        handCtx.shadowBlur = 10;
        handCtx.shadowColor = boneColor;
        drawConnectors(handCtx, hand.lm, HAND_CONNECTIONS, {
          color: boneColor,
          lineWidth: 3,
        });
        drawLandmarks(handCtx, hand.lm, {
          color: '#ffffff',
          lineWidth: 1,
          radius: 2,
        });
        handCtx.restore();
      }
      handCtx.restore();
    }

    // ---------------------------------------------------------------------
    // Multi-cube state machine.
    // Pre-pass: gesture global (clap, charge-fist spawn detection).
    // Per-cube loop: SPAWNED/GRABBED/UNFOLDED logic. Hand claim untuk hindari
    // konflik antar-kubus di frame yang sama.
    // Post-pass: cleanup kubus IDLE dengan fade habis.
    // ---------------------------------------------------------------------

    // Global state untuk gesture yang bukan per-cube
    const globalState = {
      clapFramesClose: 0,
      clapDebounceUntil: 0,
      fistSpawnDebounceUntil: 0,
      handFistTrack: {}, // key: 'Left'|'Right'
    };

    const FIST_CHARGE_MS = 1000;
    const SPAWN_BLOCK_DIST = 0.55;        // kubus dianggap "dekat" jika dalam jarak ini
    const FIST_SPAWN_AFTER_CLAP_MS = 1200;

    function nearestCubeTo(pos, filterStates) {
      let best = null;
      let bestD = Infinity;
      for (const c of cubes) {
        if (filterStates && !filterStates.includes(c.state.state)) continue;
        const d = c.state.smoothPos.distanceTo(pos);
        if (d < bestD) { bestD = d; best = c; }
      }
      return { cube: best, dist: bestD };
    }

    function spawnAt(world, hint) {
      // Coba reuse slot IDLE yang sudah fade habis
      let cube = cubes.find(c => c.state.state === STATES.IDLE && c.state.fade < 0.05);
      if (!cube) {
        cube = createCube();
        cubes.push(cube);
      }
      const st = cube.state;
      st.pos.copy(world);
      st.smoothPos.copy(world);
      st.hasSmooth = true;
      st.scale = 0.001;
      st.targetScale = 1.0;
      st.targetFade = 1.0;
      st.unfold = 0;
      st.targetUnfold = 0;
      cube.group.rotation.set(0, 0, 0);
      setState(cube, STATES.SPAWNED, hint || ' ✊ genggam dekat kubus untuk memindahkan');
      return cube;
    }

    function despawnCube(cube) {
      setState(cube, STATES.IDLE);
      cube.state.targetFade = 0;
      cube.state.targetScale = 0.001;
      cube.state.targetUnfold = 0;
      cube.state.grabHandIdx = -1;
    }

    function cleanupDeadCubes() {
      // Sisakan minimal 1 slot (untuk reuse)
      for (let i = cubes.length - 1; i >= 0 && cubes.length > 1; i--) {
        const c = cubes[i];
        if (c.state.state === STATES.IDLE && c.state.fade < 0.01) {
          scene.remove(c.group);
          c.fillMat.dispose();
          c.wireMat.dispose();
          c.haloMat.dispose();
          cubes.splice(i, 1);
        }
      }
    }

    function tickStateMachine(now) {
      const hand1 = latestHands[0];
      const hand2 = latestHands[1];

      // ===== PRE-PASS GLOBAL =====
      // ----- Clap detection -----
      let clapTriggered = false;
      if (latestHands.length === 2) {
        const d = dist(hand1.palm, hand2.palm);
        if (d < CLAP_DIST_NORM) {
          globalState.clapFramesClose++;
        } else {
          globalState.clapFramesClose = 0;
        }
        if (globalState.clapFramesClose >= CLAP_FRAMES && now > globalState.clapDebounceUntil) {
          clapTriggered = true;
          globalState.clapDebounceUntil = now + CLAP_DEBOUNCE_MS;
          globalState.fistSpawnDebounceUntil = now + FIST_SPAWN_AFTER_CLAP_MS;
          globalState.clapFramesClose = 0;
          flash();
        }
      } else {
        globalState.clapFramesClose = 0;
      }

      // Apakah ada kubus aktif (visible & bukan IDLE)?
      let anyActive = false;
      for (const c of cubes) {
        if (c.state.state !== STATES.IDLE && c.state.fade > 0.05) { anyActive = true; break; }
      }

      // Clap behavior:
      //  - tidak ada kubus aktif → spawn 1 kubus di tengah dua tangan
      //  - ada kubus aktif → despawn semua
      if (clapTriggered && latestHands.length === 2) {
        if (!anyActive) {
          const mid = {
            x: (hand1.palm.x + hand2.palm.x) / 2,
            y: (hand1.palm.y + hand2.palm.y) / 2,
          };
          const world = landmarkToWorld(mid);
          startBgm();
          spawnAt(world);
        } else {
          for (const c of cubes) despawnCube(c);
        }
      }

      // Per-hand ownership (frame-local). Diisi di pre-pass (charge spawn)
      // dan per-cube loop (grab/rotate/pinch claim).
      const claimedFistHand = new Set();
      const claimedRotateHand = new Set();
      const claimedPinchHand = new Set();

      // ----- Charge-fist spawn detection -----
      // User TAHAN kepalan di area kosong selama FIST_CHARGE_MS → spawn baru.
      // Saat user fist DEKAT kubus existing → reset timer (user mau grab).
      const seenLabels = new Set();
      let anyCharging = false;
      let chargeProgress = 0;
      for (let hIdx = 0; hIdx < latestHands.length; hIdx++) {
        const h = latestHands[hIdx];
        const label = h.label;
        seenLabels.add(label);
        let track = globalState.handFistTrack[label];
        if (!track) {
          track = { wasFist: false, fistStart: 0, chargedAt: null, latched: false };
          globalState.handFistTrack[label] = track;
        }

        if (h.isFist) {
          if (!track.wasFist) {
            track.fistStart = now;
            track.latched = false;
            track.chargedAt = h.palmWorld.clone();
          }
          track.wasFist = true;
          if (track.chargedAt) track.chargedAt.lerp(h.palmWorld, 0.3);

          if (!track.latched && now > globalState.fistSpawnDebounceUntil) {
            const near = nearestCubeTo(h.palmWorld, [STATES.SPAWNED, STATES.GRABBED, STATES.UNFOLDED]);
            const areaClear = !near.cube || near.dist > SPAWN_BLOCK_DIST;
            if (areaClear) {
              const heldMs = now - track.fistStart;
              const progress = Math.min(1, heldMs / FIST_CHARGE_MS);
              anyCharging = true;
              chargeProgress = Math.max(chargeProgress, progress);
              if (heldMs >= FIST_CHARGE_MS) {
                const world = track.chargedAt.clone();
                world.x = Math.max(-BOUND, Math.min(BOUND, world.x));
                world.y = Math.max(-BOUND, Math.min(BOUND, world.y));
                startBgm();
                const newCube = spawnAt(world, '✨ Kubus baru dipanggil • buka tangan lalu ✊ untuk memindahkan');
                // Cegah kubus baru langsung ter-grab di frame ini & beberapa
                // frame berikutnya: user masih fist, posisi spawn = posisi
                // tangan. Cooldown clear saat user pernah buka tangan.
                newCube.state.spawnCooldownUntil = now + 1500;
                claimedFistHand.add(hIdx);
                track.latched = true;
                flash();
              }
            } else {
              // Ada kubus dekat → reset timer agar tidak menumpuk
              track.fistStart = now;
            }
          }
        } else {
          track.wasFist = false;
          track.latched = false;
          track.chargedAt = null;
        }
      }
      // Cleanup track untuk tangan yang sudah tidak terdeteksi
      for (const k of Object.keys(globalState.handFistTrack)) {
        if (!seenLabels.has(k)) delete globalState.handFistTrack[k];
      }

      // ===== PER-CUBE LOOP =====
      for (const cube of cubes) {
        const st = cube.state;

        // ----- SPAWNED -----
        if (st.state === STATES.SPAWNED) {
          st.targetFade = 1.0;
          st.targetUnfold = 0;

          // Spawn cooldown clear saat user pernah buka tangan
          const anyFist = latestHands.some(h => h.isFist);
          if (st.spawnCooldownUntil && (!anyFist || now > st.spawnCooldownUntil)) {
            st.spawnCooldownUntil = 0;
          }
          const inCooldown = st.spawnCooldownUntil && now <= st.spawnCooldownUntil;

          let nearestDist = Infinity;
          let fistNearIdx = -1;
          for (let i = 0; i < latestHands.length; i++) {
            if (claimedFistHand.has(i)) continue;
            const d = latestHands[i].palmWorld.distanceTo(st.pos);
            if (d < nearestDist) nearestDist = d;
            if (!inCooldown && latestHands[i].isFist && d < GRAB_DIST_WORLD) {
              fistNearIdx = i;
            }
          }
          st.highlight = (nearestDist < GRAB_DIST_WORLD) ? 1 : 0;

          if (fistNearIdx >= 0) {
            st.grabHandIdx = fistNearIdx;
            st.grabFromState = STATES.SPAWNED;
            claimedFistHand.add(fistNearIdx);
            setState(cube, STATES.GRABBED, '✋ Buka tangan untuk melepaskan • genggam kedua tangan untuk membuka jaring');
            st.scale = 1.15;
          }

          // Thumbs-up dekat kubus → despawn KUBUS INI (despawn-terdekat)
          let thumbsNear = false;
          for (const h of latestHands) {
            if (!h.isThumbsUp) continue;
            if (h.palmWorld.distanceTo(st.pos) < GRAB_DIST_WORLD * 2.0) { thumbsNear = true; break; }
          }
          if (thumbsNear) {
            despawnCube(cube);
            hintEl.textContent = '👍 Kubus dihapus';
            hintEl.style.opacity = '1';
          }
        }

        // ----- GRABBED -----
        if (st.state === STATES.GRABBED) {
          const canUnfoldFromGrab = st.grabFromState === STATES.SPAWNED;
          if (canUnfoldFromGrab && latestHands.length === 2 && hand1.isFist && hand2.isFist) {
            const palmDist = dist(hand1.palm, hand2.palm);
            if (palmDist > SPREAD_DIST_NORM) {
              st.spreadOpenFrames++;
            } else {
              st.spreadOpenFrames = 0;
            }
          } else {
            st.spreadOpenFrames = 0;
          }
          if (st.spreadOpenFrames >= SPREAD_FRAMES) {
            st.spreadOpenFrames = 0;
            st.targetUnfold = 1;
            st.grabHandIdx = -1;
            playAudio(breakAudio);
            setState(cube, STATES.UNFOLDED, '🪧 Jaring-jaring aktif. ✊✊ Dua kepal & rentangkan untuk melipat balik.');
          } else {
            let best = -1;
            let bestD = Infinity;
            for (let i = 0; i < latestHands.length; i++) {
              if (claimedFistHand.has(i) && i !== st.grabHandIdx) continue;
              if (!latestHands[i].isFist) continue;
              const d = latestHands[i].palmWorld.distanceTo(st.smoothPos);
              if (d < bestD) { bestD = d; best = i; }
            }
            if (best >= 0 && bestD < GRAB_DIST_WORLD * 2.0) {
              claimedFistHand.add(best);
              const target = latestHands[best].palmWorld;
              target.x = Math.max(-BOUND, Math.min(BOUND, target.x));
              target.y = Math.max(-BOUND, Math.min(BOUND, target.y));
              st.pos.copy(target);
              st.grabReleaseDebounceUntil = now + RELEASE_DEBOUNCE_MS;
            } else if (now > st.grabReleaseDebounceUntil) {
              st.grabHandIdx = -1;
              const back = st.grabFromState === STATES.UNFOLDED ? STATES.UNFOLDED : STATES.SPAWNED;
              setState(cube, back, '✊ Genggam dekat kubus untuk mengambilnya lagi');
            }
          }
          st.highlight = 1;
        }

        // ----- UNFOLDED -----
        if (st.state === STATES.UNFOLDED) {
          st.targetFade = 1.0;
          st.targetUnfold = 1;

          // Re-grab: fist dekat kubus, kecuali ada 2 fist (itu untuk fold-back)
          const fistCount = latestHands.reduce((n, h) => n + (h.isFist ? 1 : 0), 0);
          if (fistCount < 2) {
            let fistNearIdxU = -1;
            for (let i = 0; i < latestHands.length; i++) {
              if (claimedFistHand.has(i)) continue;
              if (!latestHands[i].isFist) continue;
              const d = latestHands[i].palmWorld.distanceTo(st.smoothPos);
              if (d < GRAB_DIST_WORLD) { fistNearIdxU = i; break; }
            }
            if (fistNearIdxU >= 0) {
              st.grabHandIdx = fistNearIdxU;
              st.grabFromState = STATES.UNFOLDED;
              claimedFistHand.add(fistNearIdxU);
              setState(cube, STATES.GRABBED, '✋ Buka tangan untuk melepaskan');
            }
          }

          // Thumbs-up di UNFOLDED → cycle net pattern (global)
          const thumbsHand = latestHands.find(h => h.isThumbsUp) || null;
          if (thumbsHand && !st.thumbsLatched && now > st.swipeDebounceUntil) {
            currentNetIdx = (currentNetIdx + 1) % NETS.length;
            st.swipeDebounceUntil = now + SWIPE_DEBOUNCE_MS;
            st.thumbsLatched = true;
            netLabel.textContent = NETS[currentNetIdx].name;
            hintEl.textContent = `🔀 Pola: ${NETS[currentNetIdx].name}`;
          } else if (!thumbsHand) {
            st.thumbsLatched = false;
          }

          // Fold-back: dua fist + spread
          if (latestHands.length === 2 && hand1.isFist && hand2.isFist) {
            const palmDist = dist(hand1.palm, hand2.palm);
            if (palmDist > SPREAD_DIST_NORM) {
              st.spreadOpenFrames++;
            } else {
              st.spreadOpenFrames = 0;
            }
          } else {
            st.spreadOpenFrames = 0;
          }
          if (st.spreadOpenFrames >= SPREAD_FRAMES) {
            st.spreadOpenFrames = 0;
            st.targetUnfold = 0;
            st.grabHandIdx = -1;
            playAudio(buildingAudio);
            setState(cube, STATES.SPAWNED, '🪧 Kubus terlipat kembali. 👏 Tepuk untuk menghilangkan semua.');
          }
        }

        // ----- Pinch resize per-kubus -----
        if (st.state === STATES.SPAWNED || st.state === STATES.UNFOLDED) {
          const pointIdx = [];
          for (let i = 0; i < latestHands.length; i++) {
            if (!latestHands[i].isPointing) continue;
            if (claimedPinchHand.has(i)) continue;
            pointIdx.push(i);
          }
          if (pointIdx.length >= 2) {
            const a = latestHands[pointIdx[0]].indexTipWorld;
            const b = latestHands[pointIdx[1]].indexTipWorld;
            const mid = a.clone().add(b).multiplyScalar(0.5);
            if (mid.distanceTo(st.smoothPos) < ROTATE_TOUCH_DIST * 1.5) {
              const d = a.distanceTo(b);
              if (!st.pinchActive) {
                st.pinchBaseDist = Math.max(d, 0.05);
                st.pinchBaseScale = st.targetScale;
                st.pinchActive = true;
              } else {
                const ratio = d / st.pinchBaseDist;
                st.targetScale = Math.max(PINCH_SCALE_MIN, Math.min(PINCH_SCALE_MAX, st.pinchBaseScale * ratio));
              }
              claimedPinchHand.add(pointIdx[0]);
              claimedPinchHand.add(pointIdx[1]);
              st.highlight = 1;
            } else {
              st.pinchActive = false;
            }
          } else {
            st.pinchActive = false;
          }
        } else {
          st.pinchActive = false;
        }

        // ----- Rotasi two-finger per-kubus -----
        if (st.state === STATES.SPAWNED || st.state === STATES.UNFOLDED) {
          let rotateHandIdx = -1;
          let rotatePivot = null;
          if (!st.pinchActive) {
            for (let i = 0; i < latestHands.length; i++) {
              if (claimedRotateHand.has(i)) continue;
              const h = latestHands[i];
              if (!h.isTwoFingerRotate) continue;
              const pivot = h.indexTipWorld.clone().add(h.middleTipWorld).multiplyScalar(0.5);
              const d = pivot.distanceTo(st.smoothPos);
              if (d < ROTATE_TOUCH_DIST) { rotateHandIdx = i; rotatePivot = pivot; break; }
            }
          }
          if (rotateHandIdx >= 0 && rotatePivot) {
            if (st.rotateLastIndex && st.rotateActive) {
              const dx = rotatePivot.x - st.rotateLastIndex.x;
              const dy = rotatePivot.y - st.rotateLastIndex.y;
              cube.group.rotation.y += dx * ROTATE_SENSITIVITY;
              cube.group.rotation.x += -dy * ROTATE_SENSITIVITY;
            }
            st.rotateLastIndex = rotatePivot.clone();
            st.rotateActive = true;
            st.highlight = 1;
            claimedRotateHand.add(rotateHandIdx);
          } else {
            st.rotateActive = false;
            st.rotateLastIndex = null;
          }
        } else {
          st.rotateActive = false;
          st.rotateLastIndex = null;
        }

        // ----- IDLE: fade out -----
        if (st.state === STATES.IDLE) {
          st.targetFade = 0;
          st.targetScale = 0.001;
          st.targetUnfold = 0;
        }
      }

      // ===== POST-PASS =====
      if (anyCharging) {
        const pct = Math.round(chargeProgress * 100);
        const filled = Math.round(chargeProgress * 10);
        const bar = '█'.repeat(filled) + '░'.repeat(10 - filled);
        hintEl.textContent = `✊ Menahan kepalan… ${bar} ${pct}%`;
        hintEl.style.opacity = '1';
      } else if (!anyActive && !clapTriggered) {
        hintEl.textContent = '👏 Tepuk tangan untuk memunculkan kubus  •  ✊ tahan kepalan ~1.0 detik di area kosong untuk panggil kubus baru';
      }

      cleanupDeadCubes();
      refreshStateLabel();
    }

    // Render loop utama. Semua animasi & feedback visual (warna neon,
    // pulse halo, auto-rotate) dihitung di sini.
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;

      fpsAccum += 1 / Math.max(dt, 1e-4);
      fpsCount++;
      if (fpsCount >= 20) {
        fpsEl.textContent = Math.round(fpsAccum / fpsCount);
        fpsAccum = 0; fpsCount = 0;
      }

      updateHud();
      tickStateMachine(now);

      // Apply per-kubus: smoothing, fade, scale, unfold, transform, material.
      for (const cube of cubes) {
        const st = cube.state;

        if (st.hasSmooth) {
          st.smoothPos.lerp(st.pos, SMOOTHING);
        }

        st.fade += (st.targetFade - st.fade) * Math.min(1, (st.targetFade > st.fade ? FADE_IN_SPEED : FADE_OUT_SPEED) * dt);
        st.scale += (st.targetScale - st.scale) * Math.min(1, SCALE_SPEED * dt);

        st.unfold += (st.targetUnfold - st.unfold) * Math.min(1, UNFOLD_SPEED * dt);
        const easedUnfold = st.unfold < 0.001 ? 0 : (st.unfold > 0.999 ? 1 : st.unfold);
        setUnfold(cube, easedUnfold);

        const visible = st.fade > 0.01;
        cube.group.visible = visible;
        if (visible) {
          cube.group.position.copy(st.smoothPos);
          cube.group.scale.setScalar(st.scale);
          const spinFactor = (1 - st.unfold) * (st.rotateActive ? 0 : 1);
          cube.group.rotation.y += dt * 0.5 * spinFactor;

          cube.fillMat.opacity = 0.18 * st.fade;
          cube.wireMat.opacity = 1.0 * st.fade;
          cube.haloMat.opacity = 0.4 * st.fade;

          const targetColor = st.state === STATES.UNFOLDED
            ? 0x9d4dff
            : (st.state === STATES.GRABBED
              ? NEON_GRAB
              : (st.highlight ? NEON_HIGHLIGHT : NEON_COLOR));
          const targetCol = new THREE.Color(targetColor);
          cube.wireMat.color.lerp(targetCol, Math.min(1, 6 * dt));
          cube.fillMat.color.lerp(targetCol, Math.min(1, 6 * dt));
          cube.haloMat.color.lerp(targetCol, Math.min(1, 6 * dt));

          const pulse = 1 + Math.sin(now * 0.005) * 0.15;
          cube.haloMat.linewidth = 14 * pulse;
        }
      }

      renderer.render(scene, camera);
      drawHandSkeleton();
    }

    // ---------------------------------------------------------------------
    // [8] BOOT — inisialisasi MediaPipe Hands + utility Camera dari
    // @mediapipe/camera_utils. Camera mengambil frame dari <video> dan
    // memanggil hands.send() pada interval optimal sesuai device.
    // boot() di-IIFE: cek dukungan getUserMedia → start → mulai animate().
    // ---------------------------------------------------------------------
    async function startMediaPipe() {
      if (typeof Hands === 'undefined' || typeof Camera === 'undefined') {
        throw new Error('Library MediaPipe gagal dimuat. Periksa koneksi internet.');
      }
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`,
      });
      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 0,
        minDetectionConfidence: 0.9,
        minTrackingConfidence: 0.5,
      });
      hands.onResults(onResults);

      const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
      const cam = new Camera(videoEl, {
        onFrame: async () => { await hands.send({ image: videoEl }); },
        width: isMobile ? 480 : 640,
        height: isMobile ? 360 : 480,
        facingMode: 'user',
      });
      await cam.start();
    }

    (async function boot() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('Browser tidak mendukung akses kamera (getUserMedia).');
        }
        loaderText.innerHTML = 'Meminta akses kamera...';
        await startMediaPipe();
        loaderText.innerHTML = 'Siap! 👏 Tepuk tangan untuk memulai.';
        setTimeout(() => loaderEl.classList.add('hidden'), 500);
        requestAnimationFrame(animate);
      } catch (err) {
        console.error(err);
        errorMsg.textContent = err.message || 'Terjadi kesalahan tak terduga.';
        errorEl.classList.add('show');
        loaderEl.classList.add('hidden');
      }
    })();
  </script>
</body>
